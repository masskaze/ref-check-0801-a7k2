<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>食事・血圧の記録</title>
<style>
:root{
  --paper:#F1F4EE;
  --panel:#FFFFFF;
  --ink:#22262A;
  --sub:#6B7278;
  --line:#DDE3DA;
  --good:#2F6F4E;
  --over:#B8412A;
  --dia:#2C6FA8;
  --band:#E6EDE3;
  --accent:#3F6B52;
  --grid:#E2E8DE;
  --rule:#C8D2C4;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic Medium","Yu Gothic",Meiryo,system-ui,sans-serif;
  font-size:15px;line-height:1.7;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),
                   linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;background-position:-1px -1px;
}
.mincho{font-family:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"MS PMincho",serif;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:.02em}
a{color:var(--accent)}

.wrap{max-width:760px;margin:0 auto;padding:0 14px 96px}

/* ---- ヘッダ ---- */
header{background:var(--panel);border-bottom:1px solid var(--line)}
.head-in{max-width:760px;margin:0 auto;padding:14px 14px 0;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.head-in h1{font-size:17px}
.head-in .date-pick{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
nav{max-width:760px;margin:0 auto;padding:10px 14px 0;display:flex;gap:4px}
nav button{
  border:1px solid transparent;border-bottom:none;background:none;color:var(--sub);
  padding:8px 14px;border-radius:8px 8px 0 0;cursor:pointer;font-size:14px;
}
nav button[aria-selected="true"]{background:var(--paper);border-color:var(--line);color:var(--ink);font-weight:600}

/* ---- パネル ---- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin:14px 0}
.panel > h2{font-size:15px;margin-bottom:2px}
.panel > .hint{color:var(--sub);font-size:12.5px;margin:2px 0 12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px}
.field > label{font-size:12.5px;color:var(--sub)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=password],select,textarea{
  border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:#fff;min-width:0;
}
textarea{width:100%;resize:vertical}
input[type=number]{width:92px}
.btn{
  border:1px solid var(--line);background:#fff;border-radius:7px;padding:8px 14px;cursor:pointer;
}
.btn:hover{background:#F7F9F5}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#355B45}
.btn.quiet{border-color:transparent;color:var(--sub);padding:6px 8px}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{padding:5px 10px;font-size:13px}

/* ---- 塩分ゲージ ---- */
/* 7日分の帯。記録しながら週の流れが見える。 */
.week{position:relative;margin-top:12px}
.week .cols{display:flex;gap:5px}
.week .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:4px}
.week .col.today{background:var(--band)}
.week .bar-area{height:72px;width:100%;display:flex;align-items:flex-end;justify-content:center}
.week .bar{width:15px;border-radius:2px 2px 0 0}
.week .d{font-size:10px;color:var(--sub)}
.week .col.today .d{color:var(--ink);font-weight:600}
.week .sys{font-size:12.5px}
.week .goal-line{position:absolute;left:0;right:0;height:1px;background:var(--ink);opacity:.4}
.week .base-line{position:absolute;left:0;right:0;top:72px;height:1px;background:#A9B5A5}

.gauge{margin:2px 0 0}
.gauge .nums{display:flex;align-items:baseline;gap:10px}
.gauge .big{font-size:34px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.gauge .big.ok{color:var(--good)}
.gauge .big.over{color:var(--over)}
.gauge .unit{font-size:15px;color:var(--sub)}
.gauge .diff{margin-left:auto;font-size:13.5px;color:var(--sub)}
.track{position:relative;height:12px;background:var(--band);border-radius:6px;margin:10px 0 6px;overflow:hidden}
.track .fill{position:absolute;inset:0 auto 0 0;background:var(--good);border-radius:6px}
.track .fill.over{background:var(--over)}
.track .goal{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55}
.subline{font-size:12.5px;color:var(--sub)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-top:14px}
.stat{border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.stat .k{font-size:11.5px;color:var(--sub)}
.stat .v{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}

/* ---- 一覧 ---- */
.item{border-top:1px solid var(--line);padding:11px 0}
.item:first-of-type{border-top:1px solid var(--rule)}
.item:last-of-type{border-bottom:1px solid var(--rule)}
.item .top{display:flex;gap:10px;align-items:baseline}
.item .name{font-weight:600}
.item .slot{font-size:11.5px;color:var(--sub);border:1px solid var(--line);border-radius:20px;padding:1px 8px}
.item .salt{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:600}
.item .meta{font-size:12.5px;color:var(--sub);margin-top:2px}
.item .acts{display:flex;gap:4px;margin-top:4px}
.tag{display:inline-block;font-size:11px;border-radius:20px;padding:1px 8px;border:1px solid var(--line);color:var(--sub);margin-right:4px}
.tag.fix{border-color:var(--accent);color:var(--accent)}
.tag.meas{border-color:var(--dia);color:var(--dia)}
.thumb{width:52px;height:52px;object-fit:cover;border-radius:6px;border:1px solid var(--line);flex:none}
.empty{color:var(--sub);font-size:13px;padding:8px 0}

/* ---- 推定結果 ---- */
.result{border:1px solid var(--line);border-radius:9px;padding:13px;margin-top:12px;background:#FAFCF8}
.result h3{font-size:14px;margin-bottom:6px}
.result ul{margin:6px 0;padding-left:1.15em}
.result li{margin:2px 0}
.note-good{color:var(--good)}
.note-ask{color:var(--dia)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{border:1px solid var(--line);border-radius:20px;padding:5px 11px;font-size:13px;cursor:pointer;background:#fff;user-select:none}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.msg{border-radius:7px;padding:9px 12px;margin-top:10px;font-size:13.5px}
.msg.err{background:#FBEEEB;border:1px solid #E7C6BE;color:var(--over)}
.msg.ok{background:#EDF4EE;border:1px solid #C9DFCF;color:var(--good)}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---- レポート ---- */
.report{background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px}
.report h2{font-size:17px}
.report .period{color:var(--sub);font-size:13px;margin-top:2px}
.report svg{display:block;width:100%;height:auto;margin:16px 0 4px}
.report .cap{font-size:12.5px;color:var(--sub);margin:0 0 18px}
.rep-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin:14px 0 4px}
.legend{font-size:12px;color:var(--sub);display:flex;gap:14px;flex-wrap:wrap;margin-top:-6px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;vertical-align:-1px;margin-right:4px}
table.med{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
table.med th,table.med td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left}
table.med th{color:var(--sub);font-weight:500}

.disclaim{font-size:12px;color:var(--sub);border-top:1px solid var(--line);margin-top:20px;padding-top:10px}

@media (max-width:520px){
  .head-in .date-pick{width:100%;margin-left:0}
  input[type=number]{width:78px}
}
@media print{
  body{background:#fff;background-image:none}
  header,nav,.no-print{display:none !important}
  .wrap{max-width:none;padding:0}
  .report{border:none;border-radius:0;padding:0}
  .panel{break-inside:avoid}
}
</style>
</head>
<body>

<header>
  <div class="head-in">
    <h1>食事・血圧の記録</h1>
    <div class="date-pick">
      <label for="theDate">日付</label>
      <input type="date" id="theDate">
    </div>
  </div>
  <nav>
    <button id="tab-day" aria-selected="true">今日</button>
    <button id="tab-report" aria-selected="false">週次レポート</button>
    <button id="tab-settings" aria-selected="false">設定</button>
  </nav>
</header>

<div class="wrap">
  <div id="view-day"></div>
  <div id="view-report" hidden></div>
  <div id="view-settings" hidden></div>
</div>

<script>
"use strict";

/* =========================================================
   1. 保存まわり
   localStorage に 1 つのキーでまとめて持つ。書き出しが楽になる。
   ========================================================= */
const STORE_KEY = "saltlog.v1";

const DEFAULT_SETTINGS = {
  apiKey: "",
  model: "claude-sonnet-5",
  saltGoal: 6,
  bpGoalSys: 135,
  bpGoalDia: 85,
  savePhoto: true
};

let DB = { days: {}, learned: {}, settings: Object.assign({}, DEFAULT_SETTINGS) };

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      DB.days = parsed.days || {};
      DB.learned = parsed.learned || {};
      DB.settings = Object.assign({}, DEFAULT_SETTINGS, parsed.settings || {});
      // 既定を claude-sonnet-5 に変えた分を、保存済みの設定にも1度だけ反映する。
      if (!DB.settings.modelBumped) {
        if (DB.settings.model === "claude-sonnet-4-6") DB.settings.model = "claude-sonnet-5";
        DB.settings.modelBumped = true;
      }
    }
  } catch (e) {
    console.warn("読み込みに失敗しました", e);
  }
}

// 容量が足りない時は、古い写真から捨てて入れ直す。
function save() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(DB));
    return true;
  } catch (e) {
    const dropped = dropOldestPhoto();
    if (dropped) return save();
    flash("保存できませんでした。設定から書き出して、記録を減らしてください。", "err");
    return false;
  }
}

function dropOldestPhoto() {
  const dates = Object.keys(DB.days).sort();
  for (const d of dates) {
    const meals = DB.days[d].meals || [];
    for (const m of meals) {
      if (m.photo) { m.photo = null; return true; }
    }
  }
  return false;
}

function normalizeDay(d) {
  d.meals = d.meals || [];
  d.bp = d.bp || [];
  if (typeof d.alcohol !== "number") d.alcohol = 0;
  if (typeof d.meds !== "string") d.meds = "";
  if (typeof d.memo !== "string") d.memo = "";
  if (typeof d.noAlcohol !== "boolean") d.noAlcohol = false;
  return d;
}

// 読むだけ。存在しない日を作らない（空の日が書き出しに混ざるのを防ぐ）。
function dayOf(date) {
  const d = DB.days[date];
  return d ? normalizeDay(d) : { meals: [], bp: [], alcohol: 0, meds: "", memo: "", noAlcohol: false };
}

// 書き込む時はこちら。存在しなければ作る。
function ensureDay(date) {
  if (!DB.days[date]) DB.days[date] = { meals: [], bp: [], alcohol: 0, meds: "", memo: "", noAlcohol: false };
  return normalizeDay(DB.days[date]);
}

function hasRecord(date) {
  const d = DB.days[date];
  if (!d) return false;
  return (d.meals && d.meals.length) || (d.bp && d.bp.length)
    || (d.meds && d.meds.length) || num(d.alcohol) > 0 || d.noAlcohol === true;
}

/* =========================================================
   2. 小さな道具
   ========================================================= */
const $ = (sel, root) => (root || document).querySelector(sel);
const uid = () => Math.random().toString(36).slice(2, 10);

function todayStr(d) {
  const t = d || new Date();
  const p = n => String(n).padStart(2, "0");
  return t.getFullYear() + "-" + p(t.getMonth() + 1) + "-" + p(t.getDate());
}
function shiftDate(str, days) {
  const [y, m, d] = str.split("-").map(Number);
  const t = new Date(y, m - 1, d + days);
  return todayStr(t);
}
function nowTime() {
  const t = new Date();
  const p = n => String(n).padStart(2, "0");
  return p(t.getHours()) + ":" + p(t.getMinutes());
}
function fmtMD(str) {
  const [, m, d] = str.split("-");
  return Number(m) + "/" + Number(d);
}
function weekday(str) {
  const [y, m, d] = str.split("-").map(Number);
  return "日月火水木金土"[new Date(y, m - 1, d).getDay()];
}
function num(v, fallback) {
  const n = Number(v);
  return Number.isFinite(n) ? n : (fallback === undefined ? 0 : fallback);
}
function r1(n) { return Math.round(n * 10) / 10; }
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

let flashTimer = null;
function flash(text, kind, host) {
  const box = host || $("#flash-day") || document.body;
  const el = document.createElement("div");
  el.className = "msg " + (kind === "err" ? "err" : "ok");
  el.textContent = text;
  box.innerHTML = "";
  box.appendChild(el);
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => { if (el.parentNode) el.remove(); }, 6000);
}

/* =========================================================
   3. 集計
   ========================================================= */
function dayTotals(date) {
  const d = dayOf(date);
  const t = { salt: 0, kcal: 0, potassium: 0, alcohol: num(d.alcohol) };
  for (const m of d.meals) {
    t.salt += num(m.salt);
    t.kcal += num(m.kcal);
    t.potassium += num(m.potassium);
  }
  t.salt = r1(t.salt);
  t.kcal = Math.round(t.kcal);
  t.potassium = Math.round(t.potassium);
  return t;
}

function morningBp(date) {
  const d = dayOf(date);
  const list = d.bp.filter(b => b.tag === "朝" && !b.drank);
  return list.length ? list[0] : null;
}

function rangeDates(endDate, count) {
  const out = [];
  for (let i = count - 1; i >= 0; i--) out.push(shiftDate(endDate, -i));
  return out;
}

/* =========================================================
   4. 画面：今日
   ========================================================= */
const SLOTS = ["朝", "昼", "夜", "間食"];

const MODIFIERS = [
  { id: "soup_left", label: "汁を残した" },
  { id: "soup_all", label: "汁を全部飲んだ" },
  { id: "half", label: "半サイズ" },
  { id: "large", label: "大盛" },
  { id: "shared", label: "シェアした" },
  { id: "sauce_side", label: "タレは別添え" },
  { id: "no_sauce", label: "タレをかけていない" },
  { id: "no_pickles", label: "漬物を残した" }
];

let state = {
  date: todayStr(),
  tab: "day",
  slot: "昼",
  mealText: "",
  local: null,
  mods: {},
  photoFull: null,   // 送信用（長辺1024px）
  photoThumb: null,  // 保存用（長辺320px）
  estimate: null,
  busy: false,
  editingMeal: null,
  reportEnd: todayStr()
};

// 7日分の帯。塩分の棒と、朝の収縮期を縦に並べる。
function weekStrip(endDate) {
  const dates = rangeDates(endDate, 7);
  const goal = num(DB.settings.saltGoal, 6);
  const gs = num(DB.settings.bpGoalSys, 135);
  const salts = dates.map(d => dayTotals(d).salt);
  const maxV = Math.max(goal * 1.6, Math.max.apply(null, salts.concat([goal])) + 0.5);
  const AREA = 72;
  const h = v => Math.max(2, Math.round((v / maxV) * AREA));
  const goalTop = AREA - (goal / maxV) * AREA;

  const cols = dates.map(d => {
    const t = dayTotals(d);
    const has = dayOf(d).meals.length > 0;
    const m = morningBp(d);
    const over = t.salt > goal;
    const isToday = d === endDate;
    return `
    <div class="col${isToday ? " today" : ""}">
      <div class="bar-area">${has
        ? `<div class="bar" style="height:${h(t.salt)}px;background:${over ? "var(--over)" : "var(--good)"}"></div>`
        : `<span style="font-size:11px;color:#B4BAB2">—</span>`}</div>
      <div class="d">${fmtMD(d)}</div>
      <div class="sys mincho" style="color:${m ? (num(m.sys) >= gs ? "var(--over)" : "var(--good)") : "#B4BAB2"}">${m ? num(m.sys) : "—"}</div>
    </div>`;
  }).join("");

  return `
  <div class="panel">
    <div style="display:flex;align-items:baseline;gap:8px">
      <h2 style="font-size:13px">この7日</h2>
      <span style="font-size:12px;color:var(--sub)">上が塩分（横線が ${goal}g）、下が朝の上の値</span>
    </div>
    <div class="week">
      <div class="cols">${cols}</div>
      <div class="goal-line" style="top:${goalTop}px"></div>
      <div class="base-line"></div>
    </div>
  </div>`;
}

function renderDay() {
  const date = state.date;
  const d = dayOf(date);
  const t = dayTotals(date);
  const goal = num(DB.settings.saltGoal, 6);
  const over = t.salt > goal;
  const pct = Math.min(100, (t.salt / (goal * 1.6)) * 100);
  const goalPct = (goal / (goal * 1.6)) * 100;
  const diff = r1(Math.abs(t.salt - goal));

  const html = [];

  html.push(weekStrip(date));

  /* --- 塩分サマリ --- */
  html.push(`
  <div class="panel">
    <h2>${fmtMD(date)}（${weekday(date)}）の塩分</h2>
    <p class="hint">目標は1日 ${goal}g 以内です。</p>
    <div class="gauge">
      <div class="nums">
        <span class="big mincho ${over ? "over" : "ok"}">${t.salt.toFixed(1)}</span>
        <span class="unit">g</span>
        <span class="diff">${over ? "目標を " + diff + "g 超えています" : "目標まで あと " + diff + "g"}</span>
      </div>
      <div class="track">
        <div class="fill ${over ? "over" : ""}" style="width:${pct}%"></div>
        <div class="goal" style="left:${goalPct}%"></div>
      </div>
      <div class="subline">縦線が ${goal}g の位置です。</div>
    </div>
    <div class="stats">
      <div class="stat"><div class="k">エネルギー</div><div class="v mincho">${t.kcal}<span class="unit" style="font-size:12px"> kcal</span></div></div>
      <div class="stat"><div class="k">カリウム</div><div class="v mincho">${t.potassium}<span class="unit" style="font-size:12px"> mg</span></div></div>
      <div class="stat"><div class="k">純アルコール</div><div class="v mincho">${r1(t.alcohol)}<span class="unit" style="font-size:12px"> g</span></div></div>
      <div class="stat"><div class="k">食事の記録</div><div class="v mincho">${d.meals.length}<span class="unit" style="font-size:12px"> 件</span></div></div>
    </div>
    <div id="flash-day"></div>
  </div>`);

  /* --- 食事を追加 --- */
  html.push(`
  <div class="panel">
    <h2>食事を記録する</h2>
    <p class="hint">食べたものを書くと、その場で塩分が出ます。通信しません。写真のときだけ AI を使います。</p>

    <div class="chips" id="slotChips">
      ${SLOTS.map(s => `<button class="chip" data-slot="${s}" aria-pressed="${state.slot === s}">${s}</button>`).join("")}
    </div>

    <div class="row" style="margin-top:12px">
      <div class="field" style="flex:1;min-width:240px">
        <label for="mealText">食べたもの</label>
        <textarea id="mealText" rows="2" placeholder="例：担々麺（並）と半チャーハン、餃子3個">${esc(state.mealText)}</textarea>
      </div>
    </div>

    <div class="row" style="margin-top:10px">
      <div class="field">
        <label for="photoInput">写真（任意）</label>
        <input type="file" id="photoInput" accept="image/*">
      </div>
      ${state.photoThumb ? `<img class="thumb" src="${state.photoThumb}" alt="選択した写真">
        <button class="btn sm" id="clearPhoto">写真を外す</button>` : ""}
    </div>

    <p class="hint" style="margin:14px 0 4px">当てはまるものを選ぶと、推定が変わります。</p>
    <div class="chips" id="modChips">
      ${MODIFIERS.map(m => `<button class="chip" data-mod="${m.id}" aria-pressed="${!!state.mods[m.id]}">${m.label}</button>`).join("")}
    </div>

    <div id="localBox">${renderLocal(state.local)}</div>

    <div class="row" style="margin-top:14px">
      <button class="btn primary" id="recordBtn">記録する</button>
      <button class="btn" id="estimateBtn" ${state.busy ? "disabled" : ""}>
        ${state.busy ? '<span class="spin"></span>推定中' : "AI で推定する"}
      </button>
    </div>
    <p class="hint" style="margin:8px 0 0">辞書で足りないときや、写真から出すときに AI を使います。</p>

    <div id="estimateBox">${state.estimate ? renderEstimate(state.estimate) : ""}</div>
  </div>`);

  /* --- 食事の一覧 --- */
  html.push(`
  <div class="panel">
    <h2>この日の食事</h2>
    <div id="mealList">${renderMealList(d.meals)}</div>
  </div>`);

  /* --- 血圧 --- */
  html.push(`
  <div class="panel">
    <h2>血圧</h2>
    <p class="hint">朝は起床後・服薬前に測ります。飲酒後の値は必ず印を付けます。</p>
    <div class="row">
      <div class="field"><label for="bpSys">上（収縮期）</label><input type="number" id="bpSys" inputmode="numeric" placeholder="116"></div>
      <div class="field"><label for="bpDia">下（拡張期）</label><input type="number" id="bpDia" inputmode="numeric" placeholder="84"></div>
      <div class="field"><label for="bpPulse">脈拍（任意）</label><input type="number" id="bpPulse" inputmode="numeric" placeholder="68"></div>
      <div class="field"><label for="bpTag">区分</label>
        <select id="bpTag"><option>朝</option><option>夜</option></select></div>
      <div class="field"><label for="bpTime">時刻</label><input type="time" id="bpTime" value="${nowTime()}"></div>
      <div class="field"><label for="bpDrank">飲酒後</label>
        <div style="padding:8px 0"><input type="checkbox" id="bpDrank"></div></div>
      <button class="btn primary" id="bpAdd">追加</button>
    </div>
    <div id="bpList" style="margin-top:10px">${renderBpList(d.bp)}</div>

    <details style="margin-top:12px">
      <summary style="cursor:pointer;color:var(--sub);font-size:13px">まとめて貼り付ける（iPhone のショートカットから）</summary>
      <p class="hint" style="margin-top:8px">1行に1件。例：<code>2026-08-26 朝 116/84 68</code>／日付と区分は省略できます。</p>
      <textarea id="bpPaste" rows="3" placeholder="2026-08-26 朝 116/84 68&#10;2026-08-26 夜 107/77"></textarea>
      <button class="btn sm" id="bpPasteBtn" style="margin-top:6px">読み込む</button>
    </details>
  </div>`);

  /* --- 飲酒・服薬・メモ --- */
  html.push(`
  <div class="panel">
    <h2>飲酒・服薬・メモ</h2>
    <p class="hint">服薬は記録だけを残します。量の判断は主治医の領域です。<br>飲まなかった日は「休肝日」を押します。押した日だけをレポートで数えます。</p>
    <div class="row">
      <div class="field"><label for="alcoholIn">純アルコール（g）</label>
        <input type="number" id="alcoholIn" step="1" inputmode="numeric" value="${num(d.alcohol)}"></div>
      <button class="btn sm chip" id="alcZero" aria-pressed="${d.noAlcohol ? "true" : "false"}">休肝日</button>
      <div class="field" style="flex:1;min-width:220px">
        <label for="medsIn">服薬メモ</label>
        <input type="text" id="medsIn" placeholder="例：アムロジピン5mg" value="${esc(d.meds)}">
      </div>
    </div>
    <div class="field" style="margin-top:10px">
      <label for="memoIn">その日のメモ</label>
      <input type="text" id="memoIn" placeholder="例：会食、外食が2回" value="${esc(d.memo)}">
    </div>
    <div class="row" style="margin-top:10px"><button class="btn" id="saveDayBtn">この欄を保存</button></div>
  </div>`);

  $("#view-day").innerHTML = html.join("");
  bindDay();
}

function renderMealList(meals) {
  if (!meals.length) return `<div class="empty">まだ記録がありません。</div>`;
  const order = { "朝": 0, "昼": 1, "夜": 2, "間食": 3 };
  const sorted = meals.slice().sort((a, b) => (order[a.slot] ?? 9) - (order[b.slot] ?? 9));
  return sorted.map(m => {
    if (state.editingMeal === m.id) return renderMealEditor(m);
    const tags = [];
    if (m.source === "measured") tags.push(`<span class="tag meas">実測値</span>`);
    else if (m.edited) tags.push(`<span class="tag fix">手で修正</span>`);
    else if (m.source === "dict") tags.push(`<span class="tag">辞書から</span>`);
    if (m.modifiers && m.modifiers.length) {
      m.modifiers.forEach(id => {
        const mo = MODIFIERS.find(x => x.id === id);
        if (mo) tags.push(`<span class="tag">${mo.label}</span>`);
      });
    }
    return `
    <div class="item" data-id="${m.id}">
      <div class="top">
        ${m.photo ? `<img class="thumb" src="${m.photo}" alt="">` : ""}
        <div style="flex:1;min-width:0">
          <div class="top">
            <span class="slot">${esc(m.slot || "")}</span>
            <span class="name">${esc(m.label)}</span>
            <span class="salt mincho" style="font-size:17px">${r1(num(m.salt)).toFixed(1)}<span style="font-size:12px;color:var(--sub)"> g</span></span>
          </div>
          <div class="meta">${Math.round(num(m.kcal))} kcal ／ カリウム ${Math.round(num(m.potassium))} mg${m.note ? "　" + esc(m.note) : ""}</div>
          <div class="meta">${tags.join("")}</div>
          <div class="acts">
            <button class="btn quiet sm" data-act="edit" data-id="${m.id}">修正</button>
            <button class="btn quiet sm" data-act="del" data-id="${m.id}">削除</button>
          </div>
        </div>
      </div>
    </div>`;
  }).join("");
}

function renderMealEditor(m) {
  const items = m.items || [];
  const perItem = items.length ? `
    <div style="margin-top:10px">
      <div style="font-size:12.5px;color:var(--sub)">品目ごとの塩分（g）</div>
      ${items.map((it, i) => `
        <div class="row" style="margin-top:6px;align-items:center">
          <span style="flex:1;min-width:0">${esc(it.name)}</span>
          <input type="number" class="ed-item" data-i="${i}" step="0.1" value="${r1(num(it.salt))}">
        </div>`).join("")}
      <label style="display:block;margin-top:8px;font-size:13px;color:var(--sub)">
        <input type="checkbox" id="ed-learn" checked> 直した値を、この品目の値として覚える
      </label>
    </div>` : "";

  return `
  <div class="item" data-id="${m.id}">
    <div class="field"><label>品目</label><input type="text" id="ed-label" value="${esc(m.label)}"></div>
    ${perItem}
    <div class="row" style="margin-top:8px">
      <div class="field"><label>塩分 合計 g</label><input type="number" id="ed-salt" step="0.1" value="${num(m.salt)}"></div>
      <div class="field"><label>kcal</label><input type="number" id="ed-kcal" step="10" value="${num(m.kcal)}"></div>
      <div class="field"><label>カリウム mg</label><input type="number" id="ed-k" step="10" value="${num(m.potassium)}"></div>
      <div class="field"><label>区分</label>
        <select id="ed-slot">${SLOTS.map(s => `<option ${s === m.slot ? "selected" : ""}>${s}</option>`).join("")}</select></div>
    </div>
    <div class="field" style="margin-top:8px"><label>メモ</label><input type="text" id="ed-note" value="${esc(m.note || "")}"></div>
    ${items.length ? "" : `<label style="display:block;margin-top:8px;font-size:13px;color:var(--sub)">
      <input type="checkbox" id="ed-learn2"> この値を「${esc(m.label)}」として覚える
    </label>`}
    <div class="row" style="margin-top:8px">
      <label style="font-size:13px;color:var(--sub)">
        <input type="checkbox" id="ed-meas" ${m.source === "measured" ? "checked" : ""}> 店の表示値（実測）
      </label>
      <button class="btn primary sm" data-act="save-edit" data-id="${m.id}">保存</button>
      <button class="btn sm" data-act="cancel-edit">やめる</button>
    </div>
  </div>`;
}

function renderBpList(list) {
  if (!list.length) return `<div class="empty">まだ記録がありません。</div>`;
  const sorted = list.slice().sort((a, b) => String(a.time).localeCompare(String(b.time)));
  const gs = num(DB.settings.bpGoalSys, 135), gd = num(DB.settings.bpGoalDia, 85);
  return sorted.map(b => {
    const hi = num(b.sys) >= gs || num(b.dia) >= gd;
    const color = b.drank ? "var(--sub)" : (hi ? "var(--over)" : "var(--good)");
    return `
    <div class="item" data-id="${b.id}">
      <div class="top">
        <span class="slot">${esc(b.tag)}</span>
        <span class="name mincho" style="color:${color};font-size:19px">${num(b.sys)} / ${num(b.dia)}</span>
        <span class="meta">${esc(b.time || "")}${b.pulse ? "　脈 " + num(b.pulse) : ""}</span>
        ${b.drank ? `<span class="tag">飲酒後</span>` : ""}
        <span style="margin-left:auto"><button class="btn quiet sm" data-act="bpdel" data-id="${b.id}">削除</button></span>
      </div>
    </div>`;
  }).join("");
}

function renderLocal(loc) {
  if (!loc) return "";
  if (!loc.rows.length && !loc.unknown.length) return "";

  const rows = loc.rows.map(r => `
    <div class="item" style="padding:7px 0">
      <div class="top">
        <span class="name">${esc(r.name)}</span>
        <span class="salt">${r.salt.toFixed(1)} g</span>
      </div>
      <div class="meta">${r.learned ? '<span class="tag fix">あなたの値</span>' : (r.src === "仕様書" ? '<span class="tag">実測の目安</span>' : '<span class="tag">一般の目安</span>')}${r.note ? "　" + esc(r.note) : ""}</div>
    </div>`).join("");

  const unknown = loc.unknown.length
    ? `<div class="meta note-ask" style="margin-top:6px">「${loc.unknown.map(esc).join("」「")}」は辞書にありません。記録してから直すか、AI で推定してください。</div>`
    : "";

  return `
  <div class="result" style="margin-top:12px">
    <div style="display:flex;align-items:baseline;gap:8px">
      <span style="font-size:13px;font-weight:600">暫定の推定</span>
      <span style="margin-left:auto;font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;color:${loc.total.salt > num(DB.settings.saltGoal, 6) ? "var(--over)" : "var(--good)"}">${loc.total.salt.toFixed(1)}</span>
      <span style="font-size:14px;color:var(--sub)">g</span>
    </div>
    ${rows}
    ${loc.total.alcohol > 0 ? `<div class="meta" style="margin-top:4px">純アルコール ${loc.total.alcohol} g を加えます。</div>` : ""}
    ${unknown}
  </div>`;
}

function renderEstimate(e) {
  const items = (e.items || []).map(i =>
    `<li>${esc(i.name)}　<b>${r1(num(i.salt)).toFixed(1)} g</b>${i.note ? "　<span style='color:var(--sub)'>" + esc(i.note) + "</span>" : ""}</li>`
  ).join("");
  const conf = { high: "高い", medium: "ふつう", low: "低い" }[e.confidence] || "ふつう";
  const total = e.total || {};
  return `
  <div class="result">
    <h3>推定結果：${esc(e.label || "食事")}</h3>
    <div class="nums" style="display:flex;align-items:baseline;gap:8px">
      <span class="big" style="font-size:28px;font-weight:600">${r1(num(total.salt)).toFixed(1)}</span><span class="unit">g</span>
      <span style="color:var(--sub);font-size:13px">${Math.round(num(total.kcal))} kcal ／ カリウム ${Math.round(num(total.potassium))} mg${num(total.alcohol_g) > 0 ? " ／ 純アルコール " + r1(num(total.alcohol_g)) + " g" : ""}</span>
      <span style="margin-left:auto;font-size:12px;color:var(--sub)">確からしさ：${conf}</span>
    </div>
    ${items ? `<ul>${items}</ul>` : ""}
    ${(e.advice || []).length ? `<div style="margin-top:8px"><b style="font-size:13px">改善点</b><ul>${e.advice.map(a => `<li>${esc(a)}</li>`).join("")}</ul></div>` : ""}
    ${(e.praise || []).length ? `<div class="note-good" style="margin-top:6px"><ul>${e.praise.map(a => `<li>${esc(a)}</li>`).join("")}</ul></div>` : ""}
    ${(e.questions || []).length ? `<div class="note-ask" style="margin-top:6px"><b style="font-size:13px">分かると精度が上がること</b><ul>${e.questions.map(a => `<li>${esc(a)}</li>`).join("")}</ul></div>` : ""}
    <div class="row" style="margin-top:12px">
      <button class="btn primary" id="acceptEst">この内容で記録する</button>
      <button class="btn" id="discardEst">やめる</button>
    </div>
    <p class="hint" style="margin:8px 0 0">記録したあとでも、数値は手で直せます。</p>
  </div>`;
}

/* --- 今日の画面のイベント --- */
function bindDay() {
  $("#mealText").addEventListener("input", ev => {
    state.mealText = ev.target.value;
    refreshLocal();
  });

  $("#slotChips").addEventListener("click", ev => {
    const b = ev.target.closest("[data-slot]"); if (!b) return;
    state.slot = b.dataset.slot;
    $("#slotChips").querySelectorAll("[data-slot]").forEach(x =>
      x.setAttribute("aria-pressed", String(x.dataset.slot === state.slot)));
  });

  $("#modChips").addEventListener("click", ev => {
    const b = ev.target.closest("[data-mod]"); if (!b) return;
    const id = b.dataset.mod;
    state.mods[id] = !state.mods[id];
    b.setAttribute("aria-pressed", String(!!state.mods[id]));
    refreshLocal();
  });

  $("#photoInput").addEventListener("change", async ev => {
    const f = ev.target.files && ev.target.files[0];
    if (!f) return;
    try {
      state.photoFull = await shrinkImage(f, 1024, 0.75);
      state.photoThumb = await shrinkImage(f, 320, 0.6);
      renderDay();
    } catch (e) {
      flash("写真を読み込めませんでした。", "err");
    }
  });
  if ($("#clearPhoto")) $("#clearPhoto").addEventListener("click", () => {
    state.photoFull = null; state.photoThumb = null; renderDay();
  });

  $("#estimateBtn").addEventListener("click", runEstimate);
  $("#recordBtn").addEventListener("click", recordLocal);

  if ($("#acceptEst")) $("#acceptEst").addEventListener("click", acceptEstimate);
  if ($("#discardEst")) $("#discardEst").addEventListener("click", () => { state.estimate = null; renderDay(); });

  $("#mealList").addEventListener("click", onMealListClick);
  $("#bpList").addEventListener("click", ev => {
    const b = ev.target.closest("[data-act='bpdel']"); if (!b) return;
    const d = ensureDay(state.date);
    d.bp = d.bp.filter(x => x.id !== b.dataset.id);
    save(); renderDay();
  });

  $("#bpAdd").addEventListener("click", addBp);
  $("#bpPasteBtn").addEventListener("click", importBpText);
  $("#alcZero").addEventListener("click", () => {
    const d = ensureDay(state.date);
    d.noAlcohol = !d.noAlcohol;
    if (d.noAlcohol) $("#alcoholIn").value = 0;
    saveDayFields();
  });
  $("#saveDayBtn").addEventListener("click", saveDayFields);
}

function onMealListClick(ev) {
  const b = ev.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act;
  const d = ensureDay(state.date);

  if (act === "edit") { state.editingMeal = b.dataset.id; renderDay(); return; }
  if (act === "cancel-edit") { state.editingMeal = null; renderDay(); return; }
  if (act === "del") {
    if (!confirm("この記録を削除します。よろしいですか。")) return;
    d.meals = d.meals.filter(x => x.id !== b.dataset.id);
    save(); state.editingMeal = null; renderDay(); return;
  }
  if (act === "save-edit") {
    const m = d.meals.find(x => x.id === b.dataset.id); if (!m) return;

    // 品目ごとに直された分を先に取り込む
    let learnedCount = 0;
    const itemInputs = document.querySelectorAll(".ed-item");
    if (itemInputs.length && m.items) {
      const doLearn = $("#ed-learn") && $("#ed-learn").checked;
      itemInputs.forEach(inp => {
        const it = m.items[Number(inp.dataset.i)]; if (!it) return;
        const v = num(inp.value);
        if (v !== num(it.salt)) {
          if (doLearn && learnFromItem(it, v)) learnedCount++;
          it.salt = r1(v);
        }
      });
      m.salt = r1(m.items.reduce((t, x) => t + num(x.salt), 0));
      m.note = m.items.map(x => x.name + " " + r1(num(x.salt)).toFixed(1) + "g").join("、");
    }

    m.label = $("#ed-label").value.trim() || m.label;
    if (!itemInputs.length) m.salt = num($("#ed-salt").value);
    m.kcal = num($("#ed-kcal").value);
    m.potassium = num($("#ed-k").value);
    m.slot = $("#ed-slot").value;
    m.note = $("#ed-note").value.trim();
    m.source = $("#ed-meas").checked ? "measured" : (m.source === "ai" ? "ai" : (m.source === "dict" ? "dict" : "manual"));
    m.edited = true;

    // 辞書に無い品目は、名前をそのまま覚える
    if (!(m.items && m.items.length) && $("#ed-learn2") && $("#ed-learn2").checked) {
      learnByName(m.label, m.salt, m.kcal, m.potassium);
      learnedCount++;
    }

    save(); state.editingMeal = null; renderDay();
    flash(learnedCount ? "修正を保存し、次から同じ値を使います。" : "修正を保存しました。", "ok");
  }
}

// 打つたびに辞書を引く。画面のその場だけを書き替える。
function refreshLocal() {
  const text = (state.mealText || "").trim();
  state.local = text ? estimateLocal(text, state.mods) : null;
  const box = $("#localBox");
  if (box) box.innerHTML = renderLocal(state.local);
}

// 暫定の推定をそのまま記録する。辞書に無ければ 0 で入れて、あとから直す。
function recordLocal() {
  const text = (state.mealText || "").trim();
  if (!text && !state.photoThumb) { flash("食べたものを書いてください。", "err"); return; }

  const d = ensureDay(state.date);
  const loc = state.local;
  const rows = loc ? loc.rows : [];
  const total = loc ? loc.total : { salt: 0, kcal: 0, k: 0, alcohol: 0 };

  const meal = {
    id: uid(),
    label: text || "食事",
    salt: r1(total.salt),
    kcal: Math.round(total.kcal),
    potassium: Math.round(total.k),
    note: rows.map(r => r.name + " " + r.salt.toFixed(1) + "g").join("、"),
    items: rows.map(r => ({ key: r.key, name: r.name, salt: r.salt, mult: r.mult, slCut: r.slCut })),
    slot: state.slot,
    photo: DB.settings.savePhoto ? state.photoThumb : null,
    modifiers: Object.keys(state.mods).filter(k => state.mods[k]),
    source: rows.length ? "dict" : "manual",
    edited: false
  };
  d.meals.push(meal);
  if (num(total.alcohol) > 0) { d.alcohol = r1(num(d.alcohol) + num(total.alcohol)); d.noAlcohol = false; }
  save();

  const noHit = !rows.length;
  state.photoFull = null; state.photoThumb = null; state.mods = {}; state.mealText = ""; state.local = null;
  state.editingMeal = noHit ? meal.id : null;
  renderDay();
  flash(noHit ? "辞書に無い品目です。数値を入れてください。" : "記録しました。数値は「修正」から直せます。", noHit ? "err" : "ok");
}

function acceptEstimate() {
  const e = state.estimate; if (!e) return;
  const d = ensureDay(state.date);
  const total = e.total || {};
  d.meals.push({
    id: uid(),
    label: e.label || "食事",
    salt: r1(num(total.salt)),
    kcal: Math.round(num(total.kcal)),
    potassium: Math.round(num(total.potassium)),
    note: (e.items || []).map(i => i.name + " " + r1(num(i.salt)) + "g").join("、"),
    items: (e.items || []).map(i => ({ key: normText(i.name), name: i.name, salt: r1(num(i.salt)), mult: 1, slCut: 0 })),
    slot: state.slot,
    photo: DB.settings.savePhoto ? state.photoThumb : null,
    modifiers: Object.keys(state.mods).filter(k => state.mods[k]),
    source: "ai",
    edited: false
  });
  if (num(total.alcohol_g) > 0) {
    d.alcohol = r1(num(d.alcohol) + num(total.alcohol_g));
    d.noAlcohol = false;
  }
  save();
  state.estimate = null; state.photoFull = null; state.photoThumb = null;
  state.mods = {}; state.mealText = ""; state.local = null;
  renderDay();
  flash("記録しました。数値は「修正」から直せます。", "ok");
}

function addBp() {
  const sys = num($("#bpSys").value, 0), dia = num($("#bpDia").value, 0);
  if (!sys || !dia) { flash("上と下の両方を入れてください。", "err"); return; }
  const d = ensureDay(state.date);
  d.bp.push({
    id: uid(), sys, dia,
    pulse: num($("#bpPulse").value, 0) || null,
    tag: $("#bpTag").value,
    time: $("#bpTime").value || nowTime(),
    drank: $("#bpDrank").checked
  });
  save(); renderDay();
}

// 「2026-08-26 朝 116/84 68」形式。日付と区分は省略できる。
function importBpText() {
  const text = $("#bpPaste").value || "";
  let added = 0;
  text.split(/\r?\n/).forEach(line => {
    const s = line.trim(); if (!s) return;
    const mm = s.match(/(\d{2,3})\s*[\/／]\s*(\d{2,3})/);
    if (!mm) return;
    const dm = s.match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
    const date = dm
      ? dm[1] + "-" + String(dm[2]).padStart(2, "0") + "-" + String(dm[3]).padStart(2, "0")
      : state.date;
    const tag = /夜|晩|夕/.test(s) ? "夜" : "朝";
    const tm = s.match(/(\d{1,2}):(\d{2})/);
    const rest = s.replace(mm[0], " ");
    const pm = rest.match(/(?:^|\s)(\d{2,3})(?:\s|$)/);
    ensureDay(date).bp.push({
      id: uid(), sys: num(mm[1]), dia: num(mm[2]),
      pulse: pm ? num(pm[1]) : null,
      tag,
      time: tm ? tm[0] : (tag === "朝" ? "07:00" : "21:00"),
      drank: /飲|酒/.test(s)
    });
    added++;
  });
  if (!added) { flash("読み取れる行がありませんでした。", "err"); return; }
  save(); renderDay();
  flash(added + " 件を読み込みました。", "ok");
}

function saveDayFields() {
  const d = ensureDay(state.date);
  d.alcohol = num($("#alcoholIn").value);
  if (d.alcohol > 0) d.noAlcohol = false;
  d.meds = ($("#medsIn").value || "").trim();
  d.memo = ($("#memoIn").value || "").trim();
  save(); renderDay();
  flash("保存しました。", "ok");
}

/* =========================================================
   5. 画像の縮小
   canvas で描き直すため、EXIF（撮影日時）は消えます。
   日付は画面上の「日付」欄の値を使います。
   ========================================================= */
function shrinkImage(file, maxEdge, quality) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxEdge / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * scale));
      const h = Math.max(1, Math.round(img.height * scale));
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", quality));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("画像を読めません")); };
    img.src = url;
  });
}

/* --- 文字をそろえる。カタカナはひらがなに寄せ、記号と空白を落とす。 --- */
const HALF_KANA = "｡｢｣､･ｦｧｨｩｪｫｬｭｮｯｰｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝﾞﾟ";
const FULL_KANA = "。「」、・ヲァィゥェォャュョッーアイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワンﾞﾟ";
function toFullKana(s) {
  return s.replace(/[\uFF61-\uFF9F]/g, c => {
    const i = HALF_KANA.indexOf(c);
    return i >= 0 ? FULL_KANA[i] : c;
  }).replace(/([カキクケコサシスセソタチツテトハヒフヘホ])ﾞ/g, (m, c) =>
      String.fromCharCode(c.charCodeAt(0) + 1))
    .replace(/([ハヒフヘホ])ﾟ/g, (m, c) => String.fromCharCode(c.charCodeAt(0) + 2));
}

function normText(s) {
  return toFullKana(String(s || ""))
    .replace(/[Ａ-Ｚａ-ｚ０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60))
    .replace(/[ー－―‐]/g, "ー")
    .replace(/[\s　・、,，。.／\/（）()「」【】]/g, "")
    .toLowerCase();
}

/* --- 辞書を引きやすい形に組み直す --- */
const DISH_INDEX = [];
DISH_TABLE.forEach(row => {
  const [name, salt, kcal, k, soupSalt, unit, src, alias] = row;
  const d = { key: normText(name), name, salt, kcal, k, soupSalt, unit, src, kind: "food" };
  d.names = [normText(name)].concat(alias ? alias.split("|").map(normText) : []);
  DISH_INDEX.push(d);
});
DRINK_TABLE.forEach(row => {
  const [name, alcohol, unit, alias] = row;
  const d = { key: normText(name), name, salt: 0, kcal: 0, k: 0, soupSalt: 0, unit, src: "目安", kind: "drink", alcohol };
  d.names = [normText(name)].concat(alias ? alias.split("|").map(normText) : []);
  DISH_INDEX.push(d);
});
// 長い名前から先に当てる。「味噌ラーメン」を「ラーメン」より先に見つけるため。
const DISH_NAMES = [];
DISH_INDEX.forEach(d => d.names.forEach(n => { if (n) DISH_NAMES.push({ n, d }); }));
DISH_NAMES.sort((a, b) => b.n.length - a.n.length);

/* --- 覚えた値があればそれを使う --- */
function baseOf(dish) {
  const learned = DB.learned && DB.learned[dish.key];
  if (!learned) return { salt: dish.salt, kcal: dish.kcal, k: dish.k, learned: false };
  return {
    salt: num(learned.salt, dish.salt),
    kcal: num(learned.kcal, dish.kcal),
    k: num(learned.k, dish.k),
    learned: true
  };
}

const SIZE_WORDS = [
  { re: /(半|ハーフ|はーふ|ミニ|みに)$/, mult: 0.5, label: "半" },
  { re: /(大盛|おおもり|特盛|とくもり)$/, mult: 1.35, label: "大盛" },
  { re: /(小盛|こもり|少なめ|すくなめ)$/, mult: 0.7, label: "小盛" }
];

/* 助詞や、修飾を表す言葉。未一致の知らせから外す。 */
const FILLER = /(と|を|の|で|に|は|が|も|や|から|まで|づつ|ずつ|\d+|個|本|枚|杯|切れ|貫|串|人前|玉|合|皿|しぇあ|はんぶん|はんぶんこ|のこした|のこす|ぜんぶ|すこし|など|つき|いり|いっしょ|らんち|せっと|なみ|ふつう|あさ|ひる|よる)/g;
function stripFiller(g) { return g.replace(FILLER, ""); }

/* --- 引く対象。辞書に、あとから覚えた品目を足す。 --- */
function candidateNames() {
  const extra = [];
  const learned = DB.learned || {};
  Object.keys(learned).forEach(key => {
    if (DISH_INDEX.some(d => d.names.indexOf(key) >= 0)) return;
    const v = learned[key];
    extra.push({
      n: key,
      d: {
        key, name: v.name || key, salt: num(v.salt), kcal: num(v.kcal), k: num(v.k),
        soupSalt: 0, unit: "", src: "あなたの値", kind: "food", names: [key]
      }
    });
  });
  if (!extra.length) return DISH_NAMES;
  return DISH_NAMES.concat(extra).sort((a, b) => b.n.length - a.n.length);
}

/* --- 本文から料理を拾う。長いものから順に、前から詰めて当てる。 --- */
function matchDishes(text) {
  const s = normText(text);
  const NAMES = candidateNames();
  const items = [];
  const gaps = [];
  let i = 0, gapStart = 0;

  while (i < s.length) {
    let hit = null;
    for (const cand of NAMES) {
      if (cand.n.length <= s.length - i && s.startsWith(cand.n, i)) { hit = cand; break; }
    }
    if (!hit) { i++; continue; }

    const before = s.slice(Math.max(0, i - 4), i);
    const after = s.slice(i + hit.n.length, i + hit.n.length + 6);

    // 個数：「餃子6個」「ビール2杯」。単位を持つ料理だけ数える。
    let qty = 1, qtyLabel = "", qtyLen = 0;
    const qm = after.match(/^(\d+)\s*(個|本|枚|杯|切れ|貫|串|人前|玉|合|皿)?/);
    if (qm && qm[1] && hit.d.unit) {
      qty = Math.max(1, Number(qm[1]));
      qtyLabel = qm[1] + (qm[2] || hit.d.unit);
      qtyLen = qm[0].length;
    }

    // 大きさ：「半チャーハン」「大盛ラーメン」
    let mult = 1, sizeLabel = "", sizeLen = 0;
    for (const sw of SIZE_WORDS) {
      const m = before.match(sw.re);
      if (m) { mult = sw.mult; sizeLabel = sw.label; sizeLen = m[1].length; break; }
    }

    // 大きさの語も読み取った分に含めるので、未一致から外す
    const startAt = i - sizeLen;
    if (startAt > gapStart) gaps.push(s.slice(gapStart, startAt));

    items.push({ dish: hit.d, qty, qtyLabel, mult, sizeLabel });
    i += hit.n.length + qtyLen;
    gapStart = i;
  }
  if (s.length > gapStart) gaps.push(s.slice(gapStart));
  return { items, gaps: gaps.map(stripFiller).filter(g => g.length >= 2) };
}

/* --- 拾った料理を、修飾の指定と合わせて数値にする --- */
function estimateLocal(text, mods) {
  const found = matchDishes(text);
  const m = mods || {};
  const shared = !!m.shared;
  const soupLeft = !!m.soup_left;
  const noSauce = !!m.no_sauce || !!m.sauce_side;
  const noPickles = !!m.no_pickles;

  const rows = [];
  let alcohol = 0;

  found.items.forEach(it => {
    const d = it.dish;
    if (d.kind === "drink") {
      alcohol += num(d.alcohol) * it.qty;
      rows.push({
        key: d.key, name: d.name + (it.qtyLabel ? " " + it.qtyLabel : ""),
        salt: 0, kcal: 0, k: 0, mult: it.qty, slCut: 0,
        src: d.src, learned: false, note: "純アルコール " + r1(num(d.alcohol) * it.qty) + "g"
      });
      return;
    }

    const base = baseOf(d);
    let mult = it.mult * it.qty;
    if (shared) mult *= 0.5;

    let salt = base.salt * mult;
    let kcal = base.kcal * mult;
    let k = base.k * mult;

    const notes = [];
    if (it.sizeLabel) notes.push(it.sizeLabel);
    if (it.qtyLabel) notes.push(it.qtyLabel);
    if (shared) notes.push("シェア");

    // 汁を残した分を引く
    let slCut = 0;
    if (soupLeft && d.soupSalt > 0) {
      slCut = d.soupSalt * mult;
      salt -= slCut;
      notes.push("汁を残した −" + r1(slCut) + "g");
    }
    // 漬物を残した／タレをかけていない
    if (noPickles && (d.key === normText("漬物") || d.key === normText("キムチ"))) {
      slCut += salt - 0.1 * mult;
      salt = 0.1 * mult;
      notes.push("残した");
    }
    if (noSauce && (d.key === normText("納豆") || d.key === normText("冷奴") || d.key === normText("餃子") || d.key === normText("サラダ"))) {
      const cut = Math.min(salt, 0.3 * mult);
      slCut += cut; salt -= cut;
      notes.push("タレなし −" + r1(cut) + "g");
    }

    rows.push({
      key: d.key, name: d.name, salt: Math.max(0, r1(salt)),
      kcal: Math.round(kcal), k: Math.round(k),
      mult, slCut, src: d.src, learned: base.learned,
      note: notes.join(" ・ ")
    });
  });

  const total = rows.reduce((t, r) => {
    t.salt += r.salt; t.kcal += r.kcal; t.k += r.k; return t;
  }, { salt: 0, kcal: 0, k: 0 });

  return {
    rows,
    unknown: found.gaps,
    total: { salt: r1(total.salt), kcal: Math.round(total.kcal), k: Math.round(total.k), alcohol: r1(alcohol) }
  };
}

/* --- 直された値を、その料理の値として覚える --- */
function learnFromItem(item, newSalt) {
  if (!item || !item.key) return false;
  const mult = num(item.mult, 1) || 1;
  const base = r1((num(newSalt) + num(item.slCut)) / mult);
  if (!(base >= 0)) return false;
  const prev = (DB.learned && DB.learned[item.key]) || {};
  DB.learned = DB.learned || {};
  DB.learned[item.key] = { salt: base, kcal: prev.kcal, k: prev.k, name: item.name || prev.name };
  return true;
}

/* 辞書にない品目でも、名前を決めて覚えられるようにする */
function learnByName(name, salt, kcal, k) {
  const key = normText(name);
  if (!key) return false;
  DB.learned = DB.learned || {};
  DB.learned[key] = { salt: r1(num(salt)), kcal: Math.round(num(kcal)) || undefined, k: Math.round(num(k)) || undefined, name: name };
  return true;
}

function buildUserContent() {

async function callClaude(body) {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "content-type": "application/json",
      "x-api-key": DB.settings.apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify(body)
  });
  const json = await res.json().catch(() => null);
  if (!res.ok) {
    const detail = json && json.error ? json.error.message : "HTTP " + res.status;
    const err = new Error(detail);
    err.status = res.status;
    throw err;
  }
  return json;
}

// 応答からテキスト部分だけを取り出す。thinking ブロックは飛ばす。
function textOf(msg) {
  return (msg.content || [])
    .filter(b => b.type === "text")
    .map(b => b.text)
    .join("");
}

// ```json のフェンスが付いた場合に備えて剥がす。
function parseJsonLoose(text) {
  let s = String(text).trim();
  const fence = s.match(/^```(?:json)?\s*([\s\S]*?)\s*```$/);
  if (fence) s = fence[1].trim();
  try { return JSON.parse(s); } catch (e) { /* 続けて括弧で切り出す */ }
  const a = s.indexOf("{"), b = s.lastIndexOf("}");
  if (a >= 0 && b > a) return JSON.parse(s.slice(a, b + 1));
  throw new Error("推定結果を読み取れませんでした。");
}

async function runEstimate() {
  if (!DB.settings.apiKey) {
    flash("先に「設定」で API キーを入れてください。", "err");
    return;
  }
  const text = (state.mealText || "").trim();
  if (!text && !state.photoFull) {
    flash("食べたものを書くか、写真を選んでください。", "err");
    return;
  }

  state.busy = true; state.estimate = null; renderDay();

  const content = buildUserContent();
  const base = {
    model: DB.settings.model,
    max_tokens: 16000,
    system: SYSTEM_PROMPT,
    thinking: { type: "adaptive" },
    messages: [{ role: "user", content }]
  };

  try {
    let msg;
    try {
      msg = await callClaude(Object.assign({}, base, {
        output_config: { effort: "medium", format: { type: "json_schema", schema: ESTIMATE_SCHEMA } }
      }));
    } catch (e) {
      // 構造化出力が使えない場合は、指示だけで JSON を出させる。
      if (e.status !== 400) throw e;
      msg = await callClaude({
        model: DB.settings.model,
        max_tokens: 8000,
        system: SYSTEM_PROMPT + "\n\n必ず JSON オブジェクトだけを返します。前後に文章を書きません。\n"
          + "形は次のとおりです：" + JSON.stringify(ESTIMATE_SCHEMA.properties),
        messages: [{ role: "user", content }]
      });
    }
    state.estimate = parseJsonLoose(textOf(msg));
  } catch (e) {
    state.busy = false; renderDay();
    flash("推定に失敗しました：" + e.message, "err");
    return;
  }
  state.busy = false;
  renderDay();
}

/* --- グラフ（案C）---
   塩分と朝の血圧を、同じ横軸で上下にそろえた1枚の図にする。
   6g を超えた日は縦の帯で貫き、服薬が変わった区切りも両方を貫く。 --- */
const CH_W = 706, CH_H = 512;
const CH = { L: 44, R: 62, SALT_T: 56, SALT_B: 236, BP_T: 302, BP_B: 482 };

function chartInner(dates, salts, goal, medRows, morns, gs, gd) {
  const L = CH.L, iw = CH_W - CH.L - CH.R;
  const bw = iw / dates.length;
  const cx = i => L + i * bw + bw / 2;
  const p = [];

  /* ---- 上：食塩相当量 ---- */
  const sIh = CH.SALT_B - CH.SALT_T;
  const maxV = Math.max(goal * 1.5, Math.ceil(Math.max.apply(null, salts.concat([goal])) + 1));
  const sy = v => CH.SALT_B - (v / maxV) * sIh;

  /* ---- 下：朝の血圧 ---- */
  const bIh = CH.BP_B - CH.BP_T;
  const vals = [];
  morns.forEach(b => { if (b) { vals.push(num(b.sys)); vals.push(num(b.dia)); } });
  const hi = Math.max(gs + 15, Math.ceil((Math.max.apply(null, vals.concat([gs])) + 8) / 10) * 10);
  const lo = Math.min(gd - 15, Math.floor((Math.min.apply(null, vals.concat([gd])) - 8) / 10) * 10);
  const by = v => CH.BP_B - ((v - lo) / (hi - lo)) * bIh;

  /* 日付の縦線。上下をそろえて読むための手がかり。 */
  dates.forEach((d, i) => {
    p.push(`<line x1="${cx(i)}" y1="${CH.SALT_T}" x2="${cx(i)}" y2="${CH.BP_B}" stroke="#E4E9E0" stroke-width="1"/>`);
  });

  /* 服薬の帯と、変わった日の区切り */
  p.push(`<text x="44" y="14" font-size="12" fill="#22262A" font-weight="600">食塩相当量（g）</text>`);
  p.push(`<text x="${L - 6}" y="38" font-size="10" fill="#6B7278" text-anchor="end">薬</text>`);
  medRows.forEach((r, i) => {
    const a = Math.max(0, dates.indexOf(r.from));
    const next = medRows[i + 1];
    const b = next ? Math.max(a, dates.indexOf(next.from)) : dates.length;
    const x1 = L + a * bw, w = Math.max(0, (L + b * bw) - x1);
    if (!w) return;
    p.push(`<rect x="${x1}" y="26" width="${w}" height="16" fill="${r.value ? (i % 2 ? "#D7E3D2" : "#E7EEE4") : "#F2F4F1"}" stroke="#FFFFFF" stroke-width="1"/>`);
    const label = r.value || "記録なし";
    if (w > label.length * 9 + 8) {
      p.push(`<text x="${x1 + w / 2}" y="37.5" font-size="10" fill="#4A5450" text-anchor="middle">${esc(label)}</text>`);
    } else if (w > 26) {
      p.push(`<text x="${x1 + 4}" y="37.5" font-size="10" fill="#4A5450">${esc(label.slice(0, Math.max(1, Math.floor(w / 10))))}…</text>`);
    }
    if (i > 0) p.push(`<line x1="${x1}" y1="26" x2="${x1}" y2="${CH.BP_B}" stroke="#8FA69A" stroke-width="1" stroke-dasharray="4 3"/>`);
  });

  /* 目標より下の帯と目盛 */
  p.push(`<rect x="${L}" y="${sy(goal)}" width="${iw}" height="${CH.SALT_B - sy(goal)}" fill="#EBF1E9"/>`);
  for (let v = 0; v <= maxV; v += 2) {
    p.push(`<line x1="${L}" y1="${sy(v)}" x2="${L + iw}" y2="${sy(v)}" stroke="#EDF1EA" stroke-width="1"/>`);
    p.push(`<text x="${L - 8}" y="${sy(v) + 4}" font-size="11" fill="#6B7278" text-anchor="end">${v}</text>`);
  }

  /* 棒 */
  dates.forEach((d, i) => {
    const v = salts[i];
    if (!dayOf(d).meals.length) {
      p.push(`<text x="${cx(i)}" y="${CH.SALT_B - 6}" font-size="11" fill="#B4BAB2" text-anchor="middle">—</text>`);
      return;
    }
    const over = v > goal;
    const w = bw * 0.56, x = cx(i) - w / 2;
    p.push(`<rect x="${x}" y="${sy(v)}" width="${w}" height="${Math.max(1, CH.SALT_B - sy(v))}" fill="${over ? "#B8412A" : "#2F6F4E"}"/>`);
    p.push(`<text x="${cx(i)}" y="${sy(v) - 6}" font-size="11" fill="${over ? "#B8412A" : "#2F6F4E"}" text-anchor="middle" font-weight="600">${v.toFixed(1)}</text>`);
  });
  p.push(`<line x1="${L}" y1="${sy(goal)}" x2="${L + iw}" y2="${sy(goal)}" stroke="#22262A" stroke-width="1.5"/>`);
  p.push(`<text x="${L + iw + 6}" y="${sy(goal) + 4}" font-size="10.5" fill="#22262A">目標 ${goal}g</text>`);

  /* 上下で共有する日付の軸 */
  p.push(`<line x1="${L}" y1="${CH.SALT_B}" x2="${L + iw}" y2="${CH.SALT_B}" stroke="#C8D2C4" stroke-width="1"/>`);
  dates.forEach((d, i) => {
    p.push(`<text x="${cx(i)}" y="${CH.SALT_B + 20}" font-size="12" fill="#22262A" text-anchor="middle">${fmtMD(d)}</text>`);
    p.push(`<text x="${cx(i)}" y="${CH.SALT_B + 34}" font-size="10" fill="#6B7278" text-anchor="middle">${weekday(d)}</text>`);
  });

  /* 下：朝の血圧 */
  p.push(`<text x="44" y="${CH.BP_T - 8}" font-size="12" fill="#22262A" font-weight="600">朝の血圧（起床後・服薬前）</text>`);
  p.push(`<rect x="${L}" y="${by(gs)}" width="${iw}" height="${CH.BP_B - by(gs)}" fill="#EBF1E9"/>`);
  for (let v = Math.ceil(lo / 20) * 20; v <= hi; v += 20) {
    p.push(`<line x1="${L}" y1="${by(v)}" x2="${L + iw}" y2="${by(v)}" stroke="#EDF1EA" stroke-width="1"/>`);
    p.push(`<text x="${L - 8}" y="${by(v) + 4}" font-size="11" fill="#6B7278" text-anchor="end">${v}</text>`);
  }
  p.push(`<line x1="${L}" y1="${by(gs)}" x2="${L + iw}" y2="${by(gs)}" stroke="#22262A" stroke-width="1.2" stroke-dasharray="5 4"/>`);
  p.push(`<text x="${L + iw + 6}" y="${by(gs) + 4}" font-size="10.5" fill="#22262A">目安 ${gs}</text>`);
  p.push(`<line x1="${L}" y1="${by(gd)}" x2="${L + iw}" y2="${by(gd)}" stroke="#2C6FA8" stroke-width="1.2" stroke-dasharray="5 4"/>`);
  p.push(`<text x="${L + iw + 6}" y="${by(gd) + 4}" font-size="10.5" fill="#2C6FA8">目安 ${gd}</text>`);

  const line = (key, color) => {
    let d = "", started = false;
    dates.forEach((dt, i) => {
      const b = morns[i];
      if (!b) { started = false; return; }
      d += (started ? " L" : " M") + cx(i) + " " + by(num(b[key]));
      started = true;
    });
    if (d) p.push(`<path d="${d.trim()}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>`);
  };
  line("sys", "#6B7278");
  line("dia", "#8FA9C4");

  dates.forEach((dt, i) => {
    const b = morns[i]; if (!b) return;
    const sys = num(b.sys), dia = num(b.dia);
    const sc = sys >= gs ? "#B8412A" : "#2F6F4E";
    const dc = dia >= gd ? "#B8412A" : "#2C6FA8";
    p.push(`<circle cx="${cx(i)}" cy="${by(sys)}" r="4" fill="${sc}"/>`);
    p.push(`<text x="${cx(i)}" y="${by(sys) - 9}" font-size="10.5" fill="${sc}" text-anchor="middle" font-weight="600">${sys}</text>`);
    p.push(`<circle cx="${cx(i)}" cy="${by(dia)}" r="4" fill="${dc}"/>`);
    p.push(`<text x="${cx(i)}" y="${by(dia) + 16}" font-size="10.5" fill="${dc}" text-anchor="middle" font-weight="600">${dia}</text>`);
  });

  /* 超過日の縦帯。最後に薄く重ね、上下を1本の列としてつなぐ。 */
  dates.forEach((d, i) => {
    if (!dayOf(d).meals.length || salts[i] <= goal) return;
    p.push(`<rect x="${L + i * bw}" y="${CH.SALT_T}" width="${bw}" height="${CH.BP_B - CH.SALT_T}" fill="#B8412A" opacity="0.06"/>`);
  });

  p.push(`<line x1="${L}" y1="${CH.BP_B}" x2="${L + iw}" y2="${CH.BP_B}" stroke="#C8D2C4" stroke-width="1"/>`);
  p.push(`<text x="${L}" y="${CH.BP_B + 20}" font-size="11" fill="#6B7278">縦の帯は、塩分が ${goal}g を超えた日です。上下の図は同じ日付でそろえています。</text>`);

  return p.join("");
}

function wrapSvg(inner, label) {
  return `<svg viewBox="0 0 ${CH_W} ${CH_H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${label}">`
    + `<rect x="0" y="0" width="${CH_W}" height="${CH_H}" fill="#fff"/>${inner}</svg>`;
}

function standaloneSvg(inner) {
  return '<?xml version="1.0" encoding="UTF-8"?>\n'
    + `<svg xmlns="http://www.w3.org/2000/svg" width="${CH_W}" height="${CH_H}" viewBox="0 0 ${CH_W} ${CH_H}">`
    + `<rect x="0" y="0" width="${CH_W}" height="${CH_H}" fill="#FFFFFF"/>${inner}</svg>`;
}

/* =========================================================
   8. 設定・書き出し
   ========================================================= */
function renderSettings() {
  const s = DB.settings;
  $("#view-settings").innerHTML = `
  <div class="panel">
    <h2>API キー</h2>
    <p class="hint">推定に Claude API を使います。キーはこの端末のブラウザにだけ保存されます。外には送りません。</p>
    <div class="row">
      <div class="field" style="flex:1;min-width:260px">
        <label for="apiKeyIn">API キー</label>
        <input type="password" id="apiKeyIn" placeholder="sk-ant-..." value="${esc(s.apiKey)}" autocomplete="off">
      </div>
      <div class="field">
        <label for="modelIn">モデル</label>
        <select id="modelIn">
          <option value="claude-sonnet-5" ${s.model === "claude-sonnet-5" ? "selected" : ""}>claude-sonnet-5（既定）</option>
          <option value="claude-opus-5" ${s.model === "claude-opus-5" ? "selected" : ""}>claude-opus-5（最も高性能。料金は高い）</option>
          <option value="claude-sonnet-4-6" ${s.model === "claude-sonnet-4-6" ? "selected" : ""}>claude-sonnet-4-6（仕様書の当初指定）</option>
        </select>
      </div>
    </div>
    <p class="hint" style="margin-top:10px">
      キーはブラウザの保存領域に入ります。共用の端末では使わないでください。
    </p>
  </div>

  <div class="panel">
    <h2>目標</h2>
    <div class="row">
      <div class="field"><label for="goalSalt">1日の塩分（g 以内）</label><input type="number" id="goalSalt" step="0.5" value="${num(s.saltGoal, 6)}"></div>
      <div class="field"><label for="goalSys">血圧の目安 上</label><input type="number" id="goalSys" value="${num(s.bpGoalSys, 135)}"></div>
      <div class="field"><label for="goalDia">血圧の目安 下</label><input type="number" id="goalDia" value="${num(s.bpGoalDia, 85)}"></div>
      <div class="field"><label for="savePhoto">写真を保存</label>
        <div style="padding:8px 0"><input type="checkbox" id="savePhoto" ${s.savePhoto ? "checked" : ""}></div></div>
    </div>
    <div class="row" style="margin-top:12px"><button class="btn primary" id="saveSettings">保存</button></div>
    <div id="flash-settings"></div>
  </div>

  <div class="panel">
    <h2>データの持ち出し</h2>
    <p class="hint">端末をまたぐには、書き出したファイルを別の端末で読み込みます。</p>
    <div class="row">
      <button class="btn" id="expJson">まるごと書き出す（JSON）</button>
      <button class="btn" id="expDaily">日ごと（CSV）</button>
      <button class="btn" id="expMeals">食事（CSV）</button>
      <button class="btn" id="expBp">血圧（CSV）</button>
    </div>
    <div class="row" style="margin-top:12px">
      <div class="field">
        <label for="impFile">読み込む（JSON）</label>
        <input type="file" id="impFile" accept="application/json,.json">
      </div>
    </div>
    <p class="hint" style="margin-top:10px">読み込むと、同じ日付の記録は置き換わります。先に書き出して控えを取ってください。</p>
  </div>

  <div class="panel">
    <h2>この記録について</h2>
    <p class="hint" style="margin:0">
      推定値は目安です。実測ではありません。
      このアプリは記録と可視化だけを行います。薬や治療の判断は含みません。
    </p>
  </div>`;

  $("#saveSettings").addEventListener("click", () => {
    DB.settings.apiKey = $("#apiKeyIn").value.trim();
    DB.settings.model = $("#modelIn").value;
    DB.settings.saltGoal = num($("#goalSalt").value, 6);
    DB.settings.bpGoalSys = num($("#goalSys").value, 135);
    DB.settings.bpGoalDia = num($("#goalDia").value, 85);
    DB.settings.savePhoto = $("#savePhoto").checked;
    save();
    flash("保存しました。", "ok", $("#flash-settings"));
  });

  $("#expJson").addEventListener("click", () =>
    downloadFile("saltlog-" + todayStr() + ".json", JSON.stringify(DB, null, 2), "application/json"));
  $("#expDaily").addEventListener("click", () => downloadFile("daily-" + todayStr() + ".csv", csvDaily(), "text/csv"));
  $("#expMeals").addEventListener("click", () => downloadFile("meals-" + todayStr() + ".csv", csvMeals(), "text/csv"));
  $("#expBp").addEventListener("click", () => downloadFile("bp-" + todayStr() + ".csv", csvBp(), "text/csv"));

  $("#impFile").addEventListener("change", async ev => {
    const f = ev.target.files && ev.target.files[0]; if (!f) return;
    try {
      const parsed = JSON.parse(await f.text());
      if (!parsed || typeof parsed.days !== "object") throw new Error("形式が違います");
      Object.assign(DB.days, parsed.days);
      save(); renderAll();
      flash("読み込みました。", "ok", $("#flash-settings"));
    } catch (e) {
      flash("読み込めませんでした：" + e.message, "err", $("#flash-settings"));
    }
    ev.target.value = "";
  });
}

function csvCell(v) {
  const s = String(v == null ? "" : v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function csvOf(rows) {
  return "\uFEFF" + rows.map(r => r.map(csvCell).join(",")).join("\r\n");
}

function csvDaily() {
  const rows = [["日付", "塩分g", "kcal", "カリウムmg", "純アルコールg", "休肝日", "朝収縮期", "朝拡張期", "服薬メモ", "メモ"]];
  Object.keys(DB.days).sort().forEach(d => {
    const t = dayTotals(d), m = morningBp(d), dd = dayOf(d);
    rows.push([d, t.salt, t.kcal, t.potassium, r1(num(dd.alcohol)), dd.noAlcohol ? "はい" : "",
      m ? m.sys : "", m ? m.dia : "", dd.meds, dd.memo]);
  });
  return csvOf(rows);
}
function csvMeals() {
  const rows = [["日付", "区分", "品目", "塩分g", "kcal", "カリウムmg", "由来", "補足", "メモ"]];
  Object.keys(DB.days).sort().forEach(d => {
    dayOf(d).meals.forEach(m => {
      const mods = (m.modifiers || []).map(id => (MODIFIERS.find(x => x.id === id) || {}).label).filter(Boolean).join("・");
      const src = m.source === "measured" ? "実測" : (m.edited ? "手で修正" : (m.source === "ai" ? "AI推定" : (m.source === "dict" ? "辞書" : "手入力")));
      rows.push([d, m.slot || "", m.label, r1(num(m.salt)), Math.round(num(m.kcal)), Math.round(num(m.potassium)), src, mods, m.note || ""]);
    });
  });
  return csvOf(rows);
}
function csvBp() {
  const rows = [["日付", "区分", "時刻", "収縮期", "拡張期", "脈拍", "飲酒後"]];
  Object.keys(DB.days).sort().forEach(d => {
    dayOf(d).bp.forEach(b => rows.push([d, b.tag, b.time || "", b.sys, b.dia, b.pulse || "", b.drank ? "はい" : ""]));
  });
  return csvOf(rows);
}

function downloadFile(name, text, mime) {
  const blob = new Blob([text], { type: mime + ";charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* =========================================================
   9. 起動
   ========================================================= */
function setTab(name) {
  state.tab = name;
  ["day", "report", "settings"].forEach(t => {
    $("#tab-" + t).setAttribute("aria-selected", String(t === name));
    $("#view-" + t).hidden = (t !== name);
  });
  renderAll();
}

function renderAll() {
  if (state.tab === "day") renderDay();
  else if (state.tab === "report") renderReport();
  else renderSettings();
}

function start() {
  load();
  state.date = todayStr();
  state.reportEnd = todayStr();
  const h = new Date().getHours();
  state.slot = h < 10 ? "朝" : (h < 15 ? "昼" : (h < 22 ? "夜" : "間食"));

  $("#theDate").value = state.date;
  $("#theDate").addEventListener("change", ev => {
    state.date = ev.target.value || todayStr();
    state.editingMeal = null; state.estimate = null;
    state.mealText = ""; state.mods = {}; state.local = null;
    state.photoFull = null; state.photoThumb = null;
    renderAll();
  });
  $("#tab-day").addEventListener("click", () => setTab("day"));
  $("#tab-report").addEventListener("click", () => setTab("report"));
  $("#tab-settings").addEventListener("click", () => setTab("settings"));

  renderDay();
}

start();
</script>
