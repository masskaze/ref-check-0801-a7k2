<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<!-- 戦国風雲録 — nobunaga/build.mjs が生成（2026-08-26）。編集は nobunaga/js, nobunaga/css へ -->
<title>戦国風雲録</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* =======================================================================
   戦国風雲録  —  スタイル
   ======================================================================= */
:root{
  --bg:#0d1119; --bg2:#141b28; --panel:#1a2231; --panel2:#212b3d;
  --line:#33405a; --line2:#46567a;
  --ink:#eee6d5; --dim:#96a1b8; --gold:#e3bd6a; --gold2:#f6dfa4;
  --red:#c8544a; --blue:#5b8fd4; --green:#5aa06a; --purple:#9b7ac0;
  --shadow:0 10px 34px -18px #000;
  --mincho:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",YuMincho,"MS PMincho",serif;
  --gothic:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic Medium","Yu Gothic",Meiryo,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;min-height:100vh}
#app{height:100vh;height:100dvh}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--gothic);font-size:13px;line-height:1.6;
  overflow:hidden;-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit}
.grow{flex:1}
.dim{color:var(--dim)}
.pad{padding:14px}
.mincho{font-family:var(--mincho)}

/* ------------------------------ 共通部品 ---------------------------- */
.btn{
  background:linear-gradient(#26314a,#1a2233);border:1px solid var(--line2);
  color:var(--ink);padding:6px 13px;border-radius:4px;cursor:pointer;
  letter-spacing:.04em;transition:.12s;white-space:nowrap;
}
.btn:hover{background:linear-gradient(#33415f,#232e44);border-color:var(--gold)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.primary{background:linear-gradient(#6b5220,#4a3714);border-color:var(--gold);color:var(--gold2)}
.btn.primary:hover{background:linear-gradient(#87682c,#5c451b)}
.btn.danger{border-color:#8a4038;color:#efb4ac}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.xs{padding:2px 7px;font-size:12px}
.btn.big{padding:11px 30px;font-size:15px;font-family:var(--mincho);letter-spacing:.16em}
.screen{display:none;height:100%}
.screen.show{display:block}

/* ------------------------------ タイトル ---------------------------- */
#title{
  display:none;place-items:center;height:100%;
  background:
    radial-gradient(circle at 50% 18%,#243354 0%,transparent 62%),
    repeating-linear-gradient(115deg,#0d1119 0 22px,#101724 22px 44px);
}
#title.show{display:grid}
.title-inner{text-align:center;padding:26px}
.title-crest{
  font-size:40px;color:var(--gold);opacity:.85;margin-bottom:4px;
  text-shadow:0 0 22px rgba(227,189,106,.5);
}
#title h1{
  font-family:var(--mincho);font-size:60px;margin:0;letter-spacing:.34em;
  color:var(--gold2);text-indent:.34em;
  text-shadow:0 3px 0 #6b4c14,0 0 34px rgba(227,189,106,.32);
}
.title-sub{letter-spacing:.55em;color:var(--dim);font-size:11px;margin:2px 0 26px;text-indent:.55em}
.title-lead{font-family:var(--mincho);color:#cdd6e6;line-height:2.1;margin:0 0 30px;font-size:15px}
.title-menu{display:flex;flex-direction:column;gap:11px;align-items:center}
.title-foot{margin-top:26px;color:#5e6a83;font-size:11px}

/* ------------------------------ 設定画面 ---------------------------- */
#setup{overflow:auto}
.setup-inner{max-width:1080px;margin:0 auto;padding:26px 20px 40px}
.sec-title{
  font-family:var(--mincho);font-size:17px;color:var(--gold);letter-spacing:.16em;
  border-bottom:1px solid var(--line);padding-bottom:7px;margin:20px 0 14px;
}
.scenario-list{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.scn{
  background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px;cursor:pointer;transition:.14s;
}
.scn:hover{border-color:var(--line2);background:var(--panel2)}
.scn.on{border-color:var(--gold);box-shadow:inset 0 0 0 1px rgba(227,189,106,.35)}
.scn h3{margin:0 0 3px;font-family:var(--mincho);font-size:18px;color:var(--gold2);letter-spacing:.1em}
.scn .yr{color:var(--dim);font-size:12px;margin-bottom:7px}
.scn p{margin:0;color:#c3cddf;font-size:12.5px;line-height:1.8}
.clanpick{display:grid;grid-template-columns:1fr 300px;gap:14px}
.clan-list{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px;
  max-height:330px;overflow:auto;padding:3px;
}
.clan-chip{
  background:var(--panel);border:1px solid var(--line);border-radius:4px;
  padding:6px 8px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:.1s;
}
.clan-chip:hover{background:var(--panel2)}
.clan-chip.on{border-color:var(--gold);background:#2a3348}
.clan-chip .sw{width:11px;height:11px;border-radius:2px;flex:none;border:1px solid rgba(255,255,255,.28)}
.clan-chip b{font-family:var(--mincho);font-weight:600;font-size:13.5px}
.clan-chip i{font-style:normal;color:var(--dim);font-size:11px;margin-left:auto}
.clan-detail{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;min-height:200px}
.clan-detail h3{margin:0 0 2px;font-family:var(--mincho);font-size:20px;color:var(--gold2)}
.setup-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.diff{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:12px;color:var(--dim)}

/* ------------------------------ 本編レイアウト ---------------------- */
#game{display:none;grid-template-rows:auto 1fr auto;height:100%}
#game.show{display:grid}
#topbar{
  display:flex;align-items:center;gap:14px;padding:6px 12px;
  background:linear-gradient(#1c2536,#151d2b);border-bottom:1px solid var(--line);
}
.tb-date{font-family:var(--mincho);font-size:16px;letter-spacing:.08em;color:var(--gold2);white-space:nowrap}
.tb-date .season{margin-left:7px;color:var(--ink);font-size:14px}
.tb-clan{display:flex;align-items:center;gap:6px;font-family:var(--mincho);font-size:15px;white-space:nowrap}
.tb-clan .crest{width:13px;height:13px;border-radius:2px;display:inline-block;border:1px solid rgba(255,255,255,.3)}
.tb-clan .dim{font-size:12px}
.tb-stats{display:flex;gap:12px;font-size:12px;color:#c8d2e4;flex-wrap:wrap;overflow:hidden}
.tb-stats b{color:var(--gold2);font-weight:600;font-variant-numeric:tabular-nums}
.tb-btns{margin-left:auto;display:flex;gap:6px}

#stage{display:grid;grid-template-columns:1fr 336px;overflow:hidden;min-height:0}
#mapwrap{
  position:relative;overflow:hidden;cursor:grab;
  background:
    radial-gradient(ellipse at 32% 44%,#16243d 0%,#0c111b 72%),
    repeating-linear-gradient(45deg,rgba(255,255,255,.014) 0 3px,transparent 3px 6px);
}
#mapwrap.drag{cursor:grabbing}
#mapscale{position:absolute;transform-origin:0 0;width:1500px;height:760px}
#links{position:absolute;inset:0;width:1500px;height:760px;pointer-events:none}
#map{position:absolute;inset:0}
.pv{
  position:absolute;width:60px;height:42px;border-radius:4px;
  border:1px solid rgba(0,0,0,.55);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:var(--mincho);font-size:13px;letter-spacing:.03em;line-height:1.15;
  color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.85);transition:.1s;
  box-shadow:0 2px 6px -2px rgba(0,0,0,.7);
}
.pv:hover{filter:brightness(1.28);z-index:5}
.pv.mine{box-shadow:0 0 0 2px var(--gold2),0 2px 8px -2px #000}
.pv.sel{outline:2px solid #fff;outline-offset:1px;z-index:6}
.pv.tgt{animation:pulse 1s infinite}
.pv.dimmed{opacity:.3}
@keyframes pulse{0%,100%{box-shadow:0 0 0 2px #ff6b5a}50%{box-shadow:0 0 0 5px rgba(255,107,90,.15)}}
.pv .hei{font-size:9.5px;font-family:var(--gothic);opacity:.9;letter-spacing:0}
.pv .flag{position:absolute;top:-5px;right:-5px;font-size:10px}
.pv.acted::after{content:"";position:absolute;inset:0;border-radius:4px;background:repeating-linear-gradient(45deg,rgba(0,0,0,.34) 0 4px,transparent 4px 8px)}
#mapctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px}
#sideToggle{display:none;position:absolute;right:10px;bottom:10px;z-index:12}
#maplegend{
  position:absolute;left:10px;bottom:10px;font-size:11px;color:var(--dim);
  background:rgba(13,17,25,.8);border:1px solid var(--line);border-radius:4px;padding:5px 9px;
}

/* ------------------------------ 右パネル ---------------------------- */
#side{background:var(--panel);border-left:1px solid var(--line);overflow:auto;min-height:0}
.ph{
  padding:8px 12px;background:linear-gradient(#26314a,#1d2637);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:3;
}
.ph h3{margin:0;font-family:var(--mincho);font-size:18px;letter-spacing:.08em;color:var(--gold2)}
.ph .owner{font-size:11.5px;color:var(--dim)}
.ph .acts{margin-left:auto;font-size:11px;color:var(--gold)}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.st{background:var(--panel);padding:5px 10px;display:flex;align-items:baseline;gap:6px;font-size:12px}
.st span{color:var(--dim);font-size:11px;min-width:34px}
.st b{font-variant-numeric:tabular-nums;font-weight:600}
.bar{height:3px;background:#2b3448;border-radius:2px;overflow:hidden;flex:1;min-width:26px}
.bar i{display:block;height:100%;background:var(--gold);border-radius:2px}
.sub{padding:6px 12px;font-size:11.5px;color:var(--dim);border-bottom:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap}
.sub b{color:#cfd8e8;font-weight:600}
.glist{border-bottom:1px solid var(--line);max-height:198px;overflow:auto}
.glist .ghead{padding:3px 12px;font-size:10.5px;letter-spacing:.2em;color:var(--dim);background:#161d2b;border-bottom:1px solid #232d40}
.grow-row{display:flex;align-items:center;gap:6px;padding:4px 12px;font-size:12px;border-bottom:1px solid #232d40}
.grow-row:hover{background:#222c3f}
.grow-row .nm{font-family:var(--mincho);font-size:13.5px;min-width:74px}
.grow-row .kv{color:var(--dim);font-size:11px;font-variant-numeric:tabular-nums}
.grow-row .loy{margin-left:auto;font-variant-numeric:tabular-nums}
.grow-row.lordrow .nm{color:var(--gold2)}
.grow-row .sk{font-size:10px;color:#8fa8c8}
.cmd-groups{padding:8px 10px 16px}
.cmd-grp{margin-bottom:9px}
.cmd-grp>h4{
  margin:0 0 5px;font-size:11px;letter-spacing:.2em;color:var(--dim);
  border-bottom:1px dotted var(--line2);padding-bottom:3px;
}
.cmd-btns{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.cmd{
  background:#232d42;border:1px solid var(--line);border-radius:3px;padding:5px 1px;
  font-size:11.5px;cursor:pointer;font-family:var(--mincho);letter-spacing:.05em;text-align:center;
}
.cmd:hover{background:#2e3a54;border-color:var(--gold)}
.cmd:disabled{opacity:.32;cursor:not-allowed}
.cmd.hot{border-color:var(--red);color:#ffb8ae}

/* ------------------------------ ログ -------------------------------- */
#logbar{height:96px;background:#0b0f17;border-top:1px solid var(--line);overflow:auto;padding:5px 12px}
#logList div{font-size:12px;line-height:1.75;color:#b9c4d8;border-bottom:1px dotted #1b2231;padding:1px 0}
#logList div .t{color:#5f6b83;margin-right:8px;font-variant-numeric:tabular-nums;font-size:11px}
#logList .good{color:#8fd6a4}
#logList .bad{color:#f0a49a}
#logList .big{color:var(--gold2);font-family:var(--mincho);font-size:13.5px}

/* ------------------------------ 合戦画面 ---------------------------- */
.overlay{
  display:none;position:fixed;inset:0;background:rgba(4,7,12,.86);z-index:50;
  align-items:center;justify-content:center;padding:14px;
}
.overlay.show{display:flex}
.battle-box{
  background:var(--bg2);border:1px solid var(--line2);border-radius:7px;
  width:min(1220px,100%);max-height:100%;display:flex;flex-direction:column;box-shadow:var(--shadow);
}
.battle-head{
  display:flex;align-items:center;gap:12px;padding:7px 12px;border-bottom:1px solid var(--line);
  background:linear-gradient(#26314a,#1b2434);font-family:var(--mincho);font-size:15px;color:var(--gold2);
}
.battle-head .dim{font-size:12px;font-family:var(--gothic)}
.battle-main{display:grid;grid-template-columns:1fr 264px;gap:0;min-height:0;flex:1;overflow:hidden}
#btlFieldWrap{overflow:auto;padding:8px;background:#0a0e15}
#btlField{position:relative;width:735px;height:539px;margin:0 auto}
.bc{
  position:absolute;width:49px;height:49px;border:1px solid rgba(0,0,0,.4);
  display:flex;align-items:center;justify-content:center;font-size:11px;color:rgba(255,255,255,.3);
  font-family:var(--mincho);
}
.bc.plain{background:#3d5a3a}
.bc.road{background:#7a6b4a}
.bc.forest{background:#25502e}
.bc.hill{background:#5c5230}
.bc.mount{background:#4a4239}
.bc.river{background:#25506e}
.bc.swamp{background:#3a4a42}
.bc.wall{background:#5b5a56}
.bc.keep{background:#8a7340;color:#2a2210}
.bc.mv{box-shadow:inset 0 0 0 2px rgba(120,200,255,.85);cursor:pointer}
.bc.at{box-shadow:inset 0 0 0 2px rgba(255,110,90,.95);cursor:pointer}
.bc.fire{background-image:repeating-linear-gradient(45deg,rgba(255,110,40,.65) 0 6px,rgba(255,180,40,.5) 6px 12px)}
.bu{
  position:absolute;width:47px;height:47px;border-radius:3px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:var(--mincho);font-size:11px;color:#fff;text-shadow:0 1px 2px #000;
  border:2px solid rgba(255,255,255,.25);transition:left .16s,top .16s;
}
.bu.s0{background:linear-gradient(#8a3a32,#6a2a24)}
.bu.s1{background:linear-gradient(#2f5286,#22406b)}
.bu.sel{border-color:#ffe9a8;box-shadow:0 0 12px rgba(255,220,140,.85);z-index:9}
.bu.done{filter:grayscale(.65) brightness(.72)}
.bu.confused{border-color:#c58fe0}
.bu .n{font-size:10.5px;line-height:1.05;max-width:44px;overflow:hidden;white-space:nowrap}
.bu .t{font-size:9px;opacity:.9;font-family:var(--gothic)}
.bu .hp{position:absolute;left:2px;right:2px;bottom:1px;height:3px;background:rgba(0,0,0,.55);border-radius:2px}
.bu .hp i{display:block;height:100%;background:#7ede96;border-radius:2px}
.bu .mo{position:absolute;left:2px;right:2px;bottom:5px;height:2px;background:rgba(0,0,0,.5);border-radius:2px}
.bu .mo i{display:block;height:100%;background:#ffd76b}
#btlSide{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:9px}
#btlSide h4{margin:0 0 5px;font-family:var(--mincho);font-size:15px;color:var(--gold2)}
.uinfo{background:#1e2738;border:1px solid var(--line);border-radius:4px;padding:8px;margin-bottom:8px;font-size:12px}
.uinfo .row{display:flex;justify-content:space-between;gap:8px}
.uinfo .row span{color:var(--dim)}
#btlCmds{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:9px}
#btlRoster .r{display:flex;gap:5px;font-size:11.5px;padding:2px 3px;border-bottom:1px dotted #26314a;cursor:pointer}
#btlRoster .r:hover{background:#26314a}
#btlRoster .r.s0 .nm{color:#f0a49a}
#btlRoster .r.s1 .nm{color:#a4c6f0}
#btlRoster .r .nm{min-width:64px;font-family:var(--mincho)}
#btlRoster .r.gone{opacity:.4;text-decoration:line-through}
#btlLog{height:78px;overflow:auto;border-top:1px solid var(--line);padding:5px 12px;background:#0b0f17;font-size:12px}
#btlLog div{padding:1px 0;color:#b9c4d8;border-bottom:1px dotted #18202e}
#btlLog .atk{color:#f0b4ac}
#btlLog .def{color:#a8c8f0}
#btlLog .big{color:var(--gold2);font-family:var(--mincho);font-size:13.5px}
#btlLog .good{color:#8fd6a4}
#btlLog .bad{color:#f0a49a}

/* ------------------------------ モーダル ---------------------------- */
.modal-box{
  background:var(--bg2);border:1px solid var(--line2);border-radius:7px;
  width:min(680px,100%);max-height:88vh;display:flex;flex-direction:column;box-shadow:var(--shadow);
}
.modal-head{
  display:flex;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line);
  font-family:var(--mincho);font-size:17px;color:var(--gold2);letter-spacing:.08em;
  background:linear-gradient(#26314a,#1b2434);
}
.modal-head .x{margin-left:auto;background:none;border:0;cursor:pointer;font-size:15px;color:var(--dim)}
.modal-head .x:hover{color:var(--ink)}
.modal-body{padding:14px;overflow:auto}
.modal-foot{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.modal-body p{margin:0 0 10px}
.pick-list{display:grid;gap:4px;max-height:340px;overflow:auto}
.pick{
  display:flex;align-items:center;gap:8px;padding:6px 9px;background:var(--panel);
  border:1px solid var(--line);border-radius:4px;cursor:pointer;font-size:12.5px;
}
.pick:hover{background:var(--panel2);border-color:var(--line2)}
.pick.on{border-color:var(--gold);background:#2a3348}
.pick .nm{font-family:var(--mincho);font-size:14px;min-width:88px}
.pick .kv{color:var(--dim);font-size:11px}
.pick .rr{margin-left:auto;color:var(--gold2);font-variant-numeric:tabular-nums}
.field{display:flex;align-items:center;gap:9px;margin:8px 0}
.field label{min-width:74px;color:var(--dim);font-size:12px}
.field input[type=range]{flex:1}
.field input[type=number]{
  width:104px;background:#101724;border:1px solid var(--line2);color:var(--ink);
  padding:4px 7px;border-radius:3px;font:inherit;text-align:right;
}
.field select{background:#101724;border:1px solid var(--line2);color:var(--ink);padding:4px 7px;border-radius:3px;font:inherit}
.hint{font-size:11.5px;color:var(--dim);line-height:1.8}
table.tbl{width:100%;border-collapse:collapse;font-size:12px}
table.tbl th,table.tbl td{border-bottom:1px solid var(--line);padding:4px 7px;text-align:left}
table.tbl th{color:var(--dim);font-weight:400;font-size:11px;letter-spacing:.08em}
table.tbl td.n{text-align:right;font-variant-numeric:tabular-nums}
table.tbl tr.me{background:rgba(227,189,106,.10)}
table.tbl tr:hover{background:#212b3d}
.helpbox h4{font-family:var(--mincho);color:var(--gold2);margin:14px 0 5px;font-size:15px;letter-spacing:.08em}
.helpbox p,.helpbox li{font-size:12.5px;line-height:1.9;color:#c6d0e2}
.helpbox ul{margin:0;padding-left:19px}

/* ------------------------------ トースト ---------------------------- */
#toast{position:fixed;left:50%;bottom:118px;transform:translateX(-50%);z-index:80;pointer-events:none;display:grid;gap:6px;justify-items:center}
#toast div{
  background:rgba(20,27,40,.97);border:1px solid var(--gold);border-radius:4px;
  padding:7px 17px;font-size:13px;color:var(--gold2);box-shadow:var(--shadow);
  animation:tin .25s ease-out;font-family:var(--mincho);max-width:70vw;
}
#toast div.bad{border-color:var(--red);color:#f4b6ae}
#toast div.good{border-color:var(--green);color:#a8dcb6}
@keyframes tin{from{opacity:0;transform:translateY(9px)}to{opacity:1}}

@media (max-width:960px){
  #stage{grid-template-columns:1fr}
  #side{position:fixed;right:0;top:44px;bottom:96px;width:min(320px,92vw);z-index:20;box-shadow:var(--shadow);transform:translateX(101%);transition:.2s}
  #side.open{transform:none}
  #sideToggle{display:block}
  .tb-stats{font-size:11px;gap:8px}
  .battle-main{grid-template-columns:1fr}
}
</style>
<div id="app">

  <!-- ============ タイトル ============ -->
  <section id="title" class="screen show">
    <div class="title-inner">
      <div class="title-crest">✿</div>
      <h1>戦国風雲録</h1>

        p.koku -= dmg; p.minchu = U.clamp(p.minchu - 6, 0, 100);

      }
      /* 火災 */
      if (S.season === 3 && rng() < 0.02) {
        p.shou = Math.round(p.shou * 0.92);
        E.log(p.name + 'の城下で火事があった。', mine ? 'bad' : '');
        return;
      }
      /* 疫病 */
      if (rng() < 0.012) {
        p.hei = Math.round(p.hei * 0.9); p.minchu = U.clamp(p.minchu - 4, 0, 100);
        E.log(p.name + 'に疫病が流行した。', mine ? 'bad' : '');
        return;
      }

      if (p.port && rng() < 0.03) {
        p.tech = U.clamp(p.tech + range(2, 5), 0, 100);
        p.gold += range(120, 340);
        E.log(p.name + 'に南蛮船が来航した。技術と交易の利を得る。', mine ? 'good' : '');
      }

  }

  /* 年齢による死・元服 */
  function lifeAndDeath() {
    S.generals.forEach(function (g) {
      if (g.status === 'child') {
        if (S.year - g.born >= 15) {
          var cc = E.clan(g.clanId);
          if (!cc || cc.dead || !E.provsOf(g.clanId).length) { g.clanId = -1; }
          g.status = g.clanId >= 0 ? 'active' : 'free';
          if (g.clanId >= 0) {
            var lord = E.lordOf(g.clanId);
            g.loyalty = U.clamp(80 + Math.round((g.giri - 50) / 3) - Math.round(E.compat(g, lord) / 4), 40, 100);
            if (g.clanId === S.playerClan) E.log(g.name + 'が元服し、家中に加わった。', 'good');
          }
        }
        return;
      }
      if (g.status === 'dead' || g.status === 'captive') return;
      var age = S.year - g.born;
      var die = false;
      if (S.year > g.fate) die = rng() < 0.30 + (S.year - g.fate) * 0.10;
      else if (age > 60) die = rng() < (age - 60) * 0.006;
      if (age > 82) die = true;
      if (die) E.killGeneral(g, '病没');
    });
  }

  E.killGeneral = function (g, reason) {
    var wasLord = false, clan = E.clan(g.clanId);
    if (clan && clan.lordId === g.id) wasLord = true;
    g.status = 'dead';
    g.items.forEach(function (ti) {
      var t = S.treasures[ti];
      if (t) { t.owner = -1; t.hidden = 1; t.prov = g.provId; }
    });
    g.items = [];
    if (g.clanId === S.playerClan || wasLord) {
      E.log(g.name + 'が' + reason + 'した。享年' + (S.year - g.born) + '。', g.clanId === S.playerClan ? 'bad' : '');
    }
    if (wasLord) E.succeed(clan);
    g.clanId = -1;
  };

  /* 家督相続 */
  E.succeed = function (clan) {
    var men = E.gensOf(clan.id).filter(function (g) { return g.id !== clan.lordId; });
    if (!men.length) { E.destroyClan(clan, '当主を失い'); return; }
    /* 同姓＞忠誠＞能力 */
    var sur = clan.name;
    men.sort(function (a, b) {
      var as = (a.name.indexOf(sur) === 0 ? 300 : 0) + a.loyalty * 1.5 + a.sei + a.sen + a.cha;
      var bs = (b.name.indexOf(sur) === 0 ? 300 : 0) + b.loyalty * 1.5 + b.sei + b.sen + b.cha;
      return bs - as;
    });
    var heir = men[0];
    clan.lordId = heir.id;
    heir.loyalty = 100;
    E.log(clan.name + '家の家督は' + heir.name + 'が継いだ。', clan.id === S.playerClan ? 'big' : '');
    /* 相性の悪い家臣は離反しやすくなる */
    E.gensOf(clan.id).forEach(function (g) {
      if (g.id === heir.id) return;
      g.loyalty = U.clamp(g.loyalty - Math.round(E.compat(g, heir) / 5) + Math.round((g.giri - 50) / 8), 5, 100);
    });
    var lp = E.provsOf(clan.id);
    if (lp.length) { clan.capital = lp[0].id; heir.provId = lp[0].id; lp.forEach(E.assignLord); }
  };

  E.destroyClan = function (clan, why) {
    if (clan.dead) return;
    clan.dead = true;
    E.provsOf(clan.id).forEach(function (p) { p.owner = null; p.lordGen = -1; });
    E.gensOf(clan.id).forEach(function (g) { g.clanId = -1; g.status = 'free'; g.loyalty = 0; });
    S.generals.forEach(function (g) { if (g.clanId === clan.id && g.status === 'child') g.clanId = -1; });
    E.log('◆ ' + clan.name + '家は' + (why || '') + '滅亡した。', 'big');
    if (clan.id === S.playerClan) { S.ended = true; S.over = 'lose'; }
  };

  /* 忠誠の変動と離反 */
  function loyaltyPhase() {
    S.clans.forEach(function (c) {
      if (c.dead) return;
      var lord = E.gen(c.lordId);
      var owned = E.provsOf(c.id).length;
      E.gensOf(c.id).forEach(function (g) {
        if (g.id === c.lordId) { g.loyalty = 100; return; }
        var d = 0;
        d += (g.giri - 55) / 25;
        d -= (g.amb - 50) / 30;
        d -= E.compat(g, lord) / 22;
        if (g.items.length) d += 0.7;
        var p = E.prov(g.provId);
        if (p && p.lordGen === g.id) d += 0.6;
        if (p && p.minchu > 70) d += 0.3;
        if (owned <= 1) d -= 0.6;
        g.loyalty = U.clamp(g.loyalty + d, 1, 100);
        /* 出奔・離反 */
        if (g.loyalty < 22 && rng() < (26 - g.loyalty) / 130) {
          var tgt = null;
          if (g.amb > 60) {
            var nb = [];
            (E.prov(g.provId) || { adj: [] }).adj.forEach(function (aid) {
              var q = E.prov(aid);
              if (q.owner != null && q.owner !== c.id && !E.clan(q.owner).dead) nb.push(q.owner);
            });
            if (nb.length) tgt = nb[rnd(nb.length)];
          }
          if (tgt != null && rng() < 0.5) {
            var to = E.clan(tgt), tp = E.provsOf(tgt)[0];
            g.clanId = tgt; g.provId = tp ? tp.id : g.provId; g.loyalty = 60;

          } else {
            g.clanId = -1; g.status = 'free'; g.loyalty = 0;
            E.log('※ ' + g.name + 'が出奔した。', c.id === S.playerClan ? 'bad' : '');
          }
          if (E.prov(g.provId)) E.assignLord(E.prov(g.provId));
        }
      });
    });
  }

  /* 同盟の期限 */
  function diplomacyPhase() {
    S.clans.forEach(function (c) {
      for (var k in c.ally) {
        c.ally[k]--;
        if (c.ally[k] <= 0) {
          delete c.ally[k];
          var o = E.clan(+k);
          if (o) { delete o.ally[c.id]; if (c.id === S.playerClan || +k === S.playerClan) E.log('※ ' + c.name + '家と' + o.name + '家の同盟が切れた。', 'bad'); }
        }
      }
      for (var k2 in c.truce) { c.truce[k2]--; if (c.truce[k2] <= 0) delete c.truce[k2]; }
    });
  }

  E.allied = function (a, b) {
    var c = E.clan(a); return !!(c && c.ally[b] > 0);
  };
  E.makeAlliance = function (a, b, turns) {
    E.clan(a).ally[b] = turns; E.clan(b).ally[a] = turns;
  };
  E.breakAlliance = function (a, b) {
    delete E.clan(a).ally[b]; delete E.clan(b).ally[a];

  };

  /* ============================ 季節送り ============================== */
  E.endSeason = function () {
    rollWeather();
    S.provinces.forEach(function (p) {
      if (p.owner == null) { p.rice += Math.round(p.koku * 1.2); return; }
      if (S.season === 2) harvest(p);
      seasonIncome(p);
      upkeep(p);
    });
    randomEvents();
    loyaltyPhase();
    diplomacyPhase();

    S.season++;
    if (S.season > 3) {
      S.season = 0; S.year++;
      lifeAndDeath();
      S.clans.forEach(function (c) {
        if (c.dead) return;
        if (!E.gensOf(c.id).length && !E.provsOf(c.id).length) E.destroyClan(c, '');
        else if (!E.provsOf(c.id).length) E.destroyClan(c, '所領を失い');
      });
      newYearEvents();
    }
    E.checkVictory();
    E.startSeason();
  };

  function newYearEvents() {
    /* 浪人の流れ／新人の登場 */
    var frees = S.generals.filter(function (g) { return g.status === 'free'; });
    frees.forEach(function (g) {
      if (rng() < 0.12) g.provId = E.prov(g.provId).adj[rnd(E.prov(g.provId).adj.length)];
    });
    /* 文化と技術は隣国へ伝わる */
    var deltaC = {}, deltaT = {};
    S.provinces.forEach(function (p) {
      var bc = 0, bt = 0;
      p.adj.forEach(function (i) {
        var q = S.provinces[i];
        if (q.culture > bc) bc = q.culture;
        if (q.tech > bt) bt = q.tech;
      });
      if (bc > p.culture + 12) deltaC[p.id] = 1 + (bc - p.culture > 30 ? 1 : 0);
      if (bt > p.tech + 12) deltaT[p.id] = 1 + (bt - p.tech > 30 ? 1 : 0);
    });
    S.provinces.forEach(function (p) {
      if (deltaC[p.id]) p.culture = U.clamp(p.culture + deltaC[p.id], 0, 100);
      if (deltaT[p.id]) p.tech = U.clamp(p.tech + deltaT[p.id], 0, 100);
    });
    if (S.year % 3 === 0) {
      S.treasures.forEach(function (t) { if (t.owner < 0 && rng() < 0.15) t.prov = rnd(S.provinces.length); });
    }
  }

  E.checkVictory = function () {
    var alive = E.aliveClans();
    var me = E.clan(S.playerClan);
    if (me.dead) { S.ended = true; S.over = 'lose'; return; }
    var mine = E.provsOf(S.playerClan).length;
    if (mine >= S.provinces.length) { S.ended = true; S.over = 'win'; return; }
    var others = alive.filter(function (c) { return c.id !== S.playerClan && E.provsOf(c.id).length > 0; });
    if (!others.length && mine > 0) {
      var neutral = S.provinces.filter(function (p) { return p.owner == null; }).length;
      if (neutral === 0) { S.ended = true; S.over = 'win'; }
    }
  };

  /* ============================ セーブ／ロード ======================== */
  E.serialize = function () {
    var o = {}, k;
    for (k in S) if (k !== 'rng') o[k] = S[k];
    o.rngState = S.seedVal;
    o.rngCalls = S.rngCalls || 0;
    return JSON.stringify(o);
  };
  E.deserialize = function (json) {
    var o = JSON.parse(json);
    o.rng = U.mulberry32((o.seedVal + (o.year * 977 + o.season * 31)) | 0);
    S = o;
    return S;
  };

})(typeof window !== 'undefined' ? window : globalThis);

    { id: 5, name: '川',   cost: 4, def: -0.22, ch: '川', cls: 'river' },
    { id: 6, name: '沼',   cost: 4, def: 0.05, ch: '沼', cls: 'swamp' },
    { id: 7, name: '城壁', cost: 3, def: 0.55, ch: '城', cls: 'wall' },
    { id: 8, name: '本丸', cost: 2, def: 0.70, ch: '丸', cls: 'keep' }
  ];

  var TYPES = B.TYPES = {
    '足軽': { move: 8,  rng: 1, atk: 1.00, def: 1.00, name: '足軽' },
    '騎馬': { move: 12, rng: 1, atk: 1.18, def: 0.94, name: '騎馬' },
    '鉄砲': { move: 6,  rng: 3, atk: 0.92, def: 0.92, name: '鉄砲' }
  };
  var ADV = {
    '騎馬': { '足軽': 1.25, '鉄砲': 1.35, '騎馬': 1.00 },
    '足軽': { '足軽': 1.00, '騎馬': 0.88, '鉄砲': 1.15 },
    '鉄砲': { '足軽': 1.18, '騎馬': 1.45, '鉄砲': 1.00 }
  };

  function idx(x, y) { return y * W + x; }
  B.idx = idx;
  B.tile = function (b, x, y) { return (x < 0 || y < 0 || x >= W || y >= H) ? null : b.map[idx(x, y)]; };
  B.unitAt = function (b, x, y) {
    for (var i = 0; i < b.units.length; i++) {
      var u = b.units[i];
      if (u.alive && u.x === x && u.y === y) return u;
    }
    return null;
  };

  /* --------------------------- 地形の生成 ---------------------------- */
  function genMap(prov) {
    var rand = U.mulberry32((prov.id * 7919 + 13) | 0);
    var m = [], x, y;
    for (y = 0; y < H; y++) for (x = 0; x < W; x++) m[idx(x, y)] = 0;

    /* 山と丘（外周寄り） */
    var mountains = 4 + Math.floor(rand() * 5);
    for (var i = 0; i < mountains; i++) {
      var mx = Math.floor(rand() * W), my = Math.floor(rand() * H);
      if (mx > 11) mx = 11;
      m[idx(mx, my)] = rand() < 0.45 ? 4 : 3;
      if (rand() < 0.6) { var nx = U.clamp(mx + (rand() < 0.5 ? 1 : -1), 0, 11), ny = U.clamp(my + (rand() < 0.5 ? 1 : -1), 0, H - 1); m[idx(nx, ny)] = 3; }
    }
    /* 森 */
    var forests = 6 + Math.floor(rand() * 6);
    for (i = 0; i < forests; i++) {
      var fx = Math.floor(rand() * 12), fy = Math.floor(rand() * H);
      if (m[idx(fx, fy)] === 0) m[idx(fx, fy)] = 2;
      if (rand() < 0.5) { var gx = U.clamp(fx + 1, 0, 11); if (m[idx(gx, fy)] === 0) m[idx(gx, fy)] = 2; }
    }
    /* 川（縦断） */
    if (rand() < 0.72) {
      var rx = 4 + Math.floor(rand() * 5);
      for (y = 0; y < H; y++) {
        m[idx(U.clamp(rx, 0, 12), y)] = 5;
        if (rand() < 0.45) rx += rand() < 0.5 ? 1 : -1;
      }
      /* 渡河点 */
      var fordY = 1 + Math.floor(rand() * (H - 2));
      for (y = 0; y < H; y++) if (Math.abs(y - fordY) <= 1) for (x = 0; x < W; x++) if (m[idx(x, y)] === 5 && rand() < 0.6) m[idx(x, y)] = 1;
    }
    /* 沼 */
    if (rand() < 0.4) {
      var sx = 2 + Math.floor(rand() * 8), sy = Math.floor(rand() * H);
      m[idx(sx, sy)] = 6;
      if (rand() < 0.6 && sy + 1 < H) m[idx(sx, sy + 1)] = 6;
    }
    /* 城（右側） */
    var cy = Math.floor(H / 2);
    for (y = cy - 2; y <= cy + 2; y++) {
      for (x = 12; x < W; x++) {
        if (y < 0 || y >= H) continue;
        m[idx(x, y)] = 7;
      }
    }
    m[idx(W - 1, cy)] = 8;
    m[idx(W - 1, cy - 1)] = 7; m[idx(W - 1, cy + 1)] = 7;
    /* 街道（左端から城門へ） */
    var ry = cy;
    for (x = 0; x < 12; x++) {
      if (m[idx(x, ry)] !== 5) m[idx(x, ry)] = 1;
      if (rand() < 0.3) ry = U.clamp(ry + (rand() < 0.5 ? 1 : -1), 1, H - 2);
    }
    return { map: m, keep: { x: W - 1, y: cy }, gate: { x: 12, y: cy } };
  }

  /* --------------------------- 部隊の生成 ---------------------------- */
  function makeUnit(b, side, gen, troops, type, homeProv) {
    var t = TYPES[type] || TYPES['足軽'];
    var tech = homeProv ? homeProv.tech : 30;
    var u = {
      id: b.units.length, side: side, gen: gen.id, name: gen.name,
      troops: Math.max(1, Math.round(troops)), max: Math.max(1, Math.round(troops)),
      type: type, morale: 0, x: 0, y: 0, mp: 0, moved: 0, acted: 0,
      alive: true, state: 'ok', confuse: 0, tech: tech,
      training: homeProv ? homeProv.training : 50, charged: 0, usedFire: 0
    };
    return u;
  }

  /* 陣形の初期配置 */
  function place(b, side, units) {
    var cy = Math.floor(H / 2), spots = [], x, y;
    if (side === 0) {
      for (y = 0; y < H; y++) for (x = 0; x <= 2; x++) spots.push([x, y, Math.abs(y - cy) * 3 + x]);
    } else {
      for (y = 0; y < H; y++) for (x = 8; x < W; x++) {
        var t = b.map[idx(x, y)];
        var d = Math.abs(x - b.keep.x) + Math.abs(y - b.keep.y);
        spots.push([x, y, d + (t >= 7 ? -6 : 0)]);
      }
    }
    spots.sort(function (a, c) { return a[2] - c[2]; });
    units.forEach(function (u) {
      for (var k = 0; k < spots.length; k++) {
        var sx = spots[k][0], sy = spots[k][1], tl = b.map[idx(sx, sy)];
        if (TERR[tl].cost > 4) continue;
        if (side === 0 && tl >= 7) continue;
        if (B.unitAt(b, sx, sy)) continue;
        u.x = sx; u.y = sy;
        return;
      }
    });
  }

  /* --------------------------- 合戦の開始 ---------------------------- */
  /* force = { prov, gens:[{gen,troops,type}], guns, horses, rice } */
  B.create = function (fromProv, toProv, force, opts) {
    opts = opts || {};
    var S = E.getState();
    var g = genMap(toProv);
    var b = {
      from: fromProv.id, prov: toProv.id,
      atkClan: fromProv.owner, defClan: toProv.owner,
      map: g.map, keep: g.keep, gate: g.gate,
      units: [], turn: 1, maxTurn: 30, side: 0, log: [],
      atkRice: force.rice, defRice: toProv.rice,
      wind: ['北', '東', '南', '西'][E.rnd(4)],
      fires: {}, over: null, phaseDone: false,
      castleLv: toProv.castleLv, spoils: null,
      naiou: [0, 0], selected: -1, autoAtk: !!opts.autoAtk, autoDef: !!opts.autoDef
    };

    /* 攻撃側 */
    force.gens.forEach(function (e) {
      if (e.troops <= 0) return;
      var u = makeUnit(b, 0, e.gen, e.troops, e.type, fromProv);
      u.morale = U.clamp(58 + Math.round(fromProv.training / 4) + Math.round((E.stat(e.gen, 'cha') - 50) / 5), 30, 100);
      b.units.push(u);
    });

    /* 守備側 */
    var defGens = E.gensIn(toProv.id).filter(function (x) { return x.clanId === toProv.owner; });
    if (!defGens.length) {
      /* 城代不在：兵だけの守備 */
      var dummy = { id: -1, name: '城兵', sen: 40, chi: 30, sei: 30, cha: 30, edu: 20, skills: [], items: [], loyalty: 100 };
      var du = makeUnit(b, 1, dummy, toProv.hei, '足軽', toProv);
      du.name = '城兵'; du.gen = -1;
      du.morale = U.clamp(45 + Math.round(toProv.minchu / 4), 25, 90);
      b.units.push(du);
    } else {
      defGens.sort(function (a, c) { return E.stat(c, 'sen') - E.stat(a, 'sen'); });
      defGens = defGens.slice(0, 8);
      var total = toProv.hei, gunsLeft = toProv.guns, horseLeft = toProv.horses;
      var share = [];
      var wsum = 0;
      defGens.forEach(function (x) { var w = E.stat(x, 'sen') + 40; wsum += w; share.push(w); });
      defGens.forEach(function (x, i) {
        var troops = Math.round(total * share[i] / wsum);
        var type = '足軽';
        if (E.has(x, '鉄砲') && gunsLeft >= troops / 3) { type = '鉄砲'; gunsLeft -= Math.round(troops / 3); }
        else if (E.has(x, '騎馬') && horseLeft >= troops / 4) { type = '騎馬'; horseLeft -= Math.round(troops / 4); }
        else if (gunsLeft >= troops / 3 && i % 3 === 1) { type = '鉄砲'; gunsLeft -= Math.round(troops / 3); }
        else if (horseLeft >= troops / 4 && i % 3 === 2) { type = '騎馬'; horseLeft -= Math.round(troops / 4); }
        if (troops <= 0) return;
        var u = makeUnit(b, 1, x, troops, type, toProv);
        u.morale = U.clamp(62 + Math.round(toProv.training / 4) + Math.round(toProv.castleLv / 8) + Math.round((x.loyalty - 60) / 6), 30, 100);
        b.units.push(u);
      });
    }

    place(b, 0, b.units.filter(function (u) { return u.side === 0; }));
    place(b, 1, b.units.filter(function (u) { return u.side === 1; }));
    B.startPhase(b, 0);
    b.log.push({ t: '【合戦】' + E.clan(b.atkClan).name + '軍が' + toProv.name + 'に攻め入った！　風は' + b.wind + '風。', k: 'big' });
    return b;
  };

  B.side = function (b, s) { return b.units.filter(function (u) { return u.alive && u.side === s; }); };
  B.gen = function (u) { return u.gen >= 0 ? E.gen(u.gen) : { name: '城兵', sen: 40, chi: 30, sei: 30, cha: 30, edu: 20, skills: [], items: [], loyalty: 100 }; };
  B.stat = function (u, k) { return u.gen >= 0 ? E.stat(E.gen(u.gen), k) : ({ sen: 40, chi: 30, sei: 30, cha: 30, edu: 20 })[k]; };
  B.has = function (u, s) { return u.gen >= 0 && E.has(E.gen(u.gen), s); };

  /* --------------------------- フェイズ ------------------------------ */
  B.startPhase = function (b, side) {
    b.side = side;
    B.side(b, side).forEach(function (u) {
      u.mp = TYPES[u.type].move + (u.state === 'confused' ? -4 : 0);
      if (u.mp < 0) u.mp = 0;
      u.moved = 0; u.acted = 0; u.charged = 0;
      if (u.confuse > 0) { u.confuse--; if (u.confuse === 0) u.state = 'ok'; }
    });
    b.phaseDone = false;
  };

  B.endPhase = function (b) {
    if (b.over) return;
    if (b.side === 0) { B.startPhase(b, 1); return; }
    /* 一巡：兵糧消費・延焼・判定 */
    B.turnEnd(b);
    if (b.over) return;
    b.turn++;
    if (b.turn > b.maxTurn) { B.finish(b, 1, '日暮れ'); return; }
    B.startPhase(b, 0);
  };

  B.turnEnd = function (b) {
    var atkTroops = 0, defTroops = 0;
    B.side(b, 0).forEach(function (u) { atkTroops += u.troops; });
    B.side(b, 1).forEach(function (u) { defTroops += u.troops; });
    b.atkRice -= Math.round(atkTroops / 55) + 1;
    b.defRice -= Math.round(defTroops / 90) + 1;
    if (b.atkRice <= 0) {
      b.atkRice = 0;
      B.side(b, 0).forEach(function (u) { u.morale = U.clamp(u.morale - 12, 0, 100); });
      b.log.push({ t: '寄せ手の兵糧が尽きた！　士気が崩れてゆく。', k: 'bad' });
      if (b.turn > 3) { B.finish(b, 1, '兵糧尽き'); return; }
    }
    if (b.defRice <= 0) {
      b.defRice = 0;
      B.side(b, 1).forEach(function (u) { u.morale = U.clamp(u.morale - 10, 0, 100); });
      b.log.push({ t: '城内の兵糧が底をついた。', k: 'bad' });
    }
    /* 延焼 */
    var newFires = {};
    for (var k in b.fires) {
      var f = b.fires[k];
      if (f <= 0) continue;
      var xy = k.split(',').map(Number);
      var u2 = B.unitAt(b, xy[0], xy[1]);
      if (u2) {
        var dmg = Math.round(u2.troops * 0.07);
        u2.troops -= dmg; u2.morale = U.clamp(u2.morale - 8, 0, 100);
        b.log.push({ t: u2.name + '隊が炎に巻かれ' + U.num(dmg) + 'を失った。', k: u2.side === 0 ? 'bad' : 'good' });
        B.checkDead(b, u2);
      }
      if (f > 1) {
        var d = { '北': [0, 1], '南': [0, -1], '東': [-1, 0], '西': [1, 0] }[b.wind];
        var nx = xy[0] + d[0], ny = xy[1] + d[1];
        if (nx >= 0 && ny >= 0 && nx < W && ny < H && TERR[b.map[idx(nx, ny)]].id !== 5) newFires[nx + ',' + ny] = f - 1;
      }
      if (f - 1 > 0) newFires[k] = f - 1;
    }
    b.fires = newFires;
    B.checkOver(b);
  };

  /* --------------------------- 移動 ---------------------------------- */
  B.reachable = function (b, u) {
    var dist = {}, res = [], q = [[u.x, u.y, u.mp]];
    dist[u.x + ',' + u.y] = u.mp;
    while (q.length) {
      var c = q.shift(), cx = c[0], cy = c[1], mp = c[2];
      var dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
      for (var i = 0; i < 4; i++) {
        var nx = cx + dirs[i][0], ny = cy + dirs[i][1];
        if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
        var t = TERR[b.map[idx(nx, ny)]];
        var cost = t.cost;
        if (u.type === '騎馬' && (t.id === 4 || t.id === 6)) cost += 2;
        if (u.type === '鉄砲' && t.id === 4) cost += 1;
        if (t.id >= 7 && u.side === 0) cost += 2;
        var other = B.unitAt(b, nx, ny);
        if (other && other.side !== u.side) continue;
        var left = mp - cost;
        if (left < 0) continue;
        var key = nx + ',' + ny;
        if (dist[key] !== undefined && dist[key] >= left) continue;
        dist[key] = left;
        q.push([nx, ny, left]);
        if (!other) res.push({ x: nx, y: ny, left: left });
      }
    }
    return res;
  };

  B.move = function (b, u, x, y) {
    if (u.acted) return false;
    var r = B.reachable(b, u), i;
    for (i = 0; i < r.length; i++) {
      if (r[i].x === x && r[i].y === y) {
        var dist = Math.abs(u.x - x) + Math.abs(u.y - y);
        u.moved += dist;
        u.x = x; u.y = y; u.mp = r[i].left;
        /* 火に飛び込む */
        if (b.fires[x + ',' + y]) {
          var dmg = Math.round(u.troops * 0.05);
          u.troops -= dmg; u.morale = U.clamp(u.morale - 5, 0, 100);
          B.checkDead(b, u);
        }
        return true;
      }
    }
    return false;
  };

  /* --------------------------- 攻撃 ---------------------------------- */
  B.dist = function (a, c) { return Math.abs(a.x - c.x) + Math.abs(a.y - c.y); };

  B.targets = function (b, u) {
    var rng = TYPES[u.type].rng;
    if (u.type === '鉄砲') rng = Math.max(2, Math.min(3, 2 + Math.floor(u.tech / 55)));
    return B.side(b, 1 - u.side).filter(function (t) { return B.dist(u, t) <= rng; });
  };

  function terrDef(b, u) {
    var t = TERR[b.map[idx(u.x, u.y)]];
    var d = t.def;
    if (t.id >= 7) d += b.castleLv / 320;
    return d;
  }

  function power(b, u) {
    var sen = B.stat(u, 'sen');
    return u.troops * (0.48 + sen / 118) * (0.62 + u.morale / 260) * (0.72 + u.training / 300);
  }

  /* mode: 'normal' | 'charge' | 'volley' */
  B.attack = function (b, u, t, mode) {
    if (u.acted) return null;
    mode = mode || 'normal';
    var d = B.dist(u, t);
    var ranged = (u.type === '鉄砲' && d > 1);
    if (!ranged && d > 1) return null;
    if (mode === 'charge' && (u.type !== '騎馬' || d > 1)) return null;

    var adv = ADV[u.type][t.type] || 1;
    var mul = TYPES[u.type].atk * adv;
    if (u.type === '鉄砲') {
      if (ranged) mul *= 1.0 + u.tech / 220;
      else mul *= 0.55;
    }
    if (mode === 'charge') mul *= 1.55;
    if (u.state === 'confused') mul *= 0.45;
    if (TERR[b.map[idx(u.x, u.y)]].id === 5) mul *= 0.7;      /* 川からの攻撃 */

    var dmg = power(b, u) * mul * 0.155 / (1 + terrDef(b, t) * TYPES[t.type].def);
    dmg *= 0.85 + E.rng() * 0.3;
    dmg = Math.max(1, Math.round(dmg));
    if (dmg > t.troops) dmg = t.troops;
    t.troops -= dmg;
    var mloss = Math.round(dmg / Math.max(1, t.max) * 100 * 0.9) + 3;
    t.morale = U.clamp(t.morale - mloss, 0, 100);
    u.morale = U.clamp(u.morale + 2, 0, 100);

    var res = { dmg: dmg, back: 0, mode: mode, ranged: ranged, target: t.name, unit: u.name };

    /* 鉄砲の斉射は混乱を誘う */
    if (u.type === '鉄砲' && ranged && E.rng() < 0.10 + u.tech / 500) {
      t.state = 'confused'; t.confuse = 1;
      res.confused = true;
    }
    /* 反撃 */
    B.checkDead(b, t);
    if (t.alive && !ranged) {
      var badv = ADV[t.type][u.type] || 1;
      var bmul = TYPES[t.type].atk * badv * (t.type === '鉄砲' ? 0.5 : 0.62);
      if (t.state === 'confused') bmul *= 0.45;
      var back = power(b, t) * bmul * 0.155 / (1 + terrDef(b, u) * TYPES[u.type].def);
      back *= 0.85 + E.rng() * 0.3;
      if (mode === 'charge') back *= 1.35;
      back = Math.max(0, Math.round(back));
      if (back > u.troops) back = u.troops;
      u.troops -= back;
      u.morale = U.clamp(u.morale - Math.round(back / Math.max(1, u.max) * 100 * 0.9), 0, 100);
      res.back = back;
      B.checkDead(b, u);
    }
    u.acted = 1; u.mp = 0;
    b.log.push({
      t: u.name + '隊が' + t.name + '隊を' + (mode === 'charge' ? '突撃！' : ranged ? '斉射！' : '攻撃！') +
        '　' + t.name + '隊' + U.num(dmg) + '討ち取る' + (res.back ? '（自軍' + U.num(res.back) + '損）' : '') +
        (res.confused ? '　＜混乱＞' : ''),
      k: u.side === 0 ? 'atk' : 'def'
    });
    B.checkOver(b);
    return res;
  };

  /* --------------------------- 計略 ---------------------------------- */
  B.canFire = function (b, u) {
    return !u.acted && !u.usedFire && B.stat(u, 'chi') >= 62;
  };
  B.fire = function (b, u, x, y) {
    if (!B.canFire(b, u)) return { ok: false, msg: 'この隊に火計は使えません。' };
    if (B.dist(u, { x: x, y: y }) > 3) return { ok: false, msg: '遠すぎます。' };
    var t = TERR[b.map[idx(x, y)]];
    if (t.id === 5) return { ok: false, msg: '川には火がつきません。' };
    u.acted = 1; u.mp = 0; u.usedFire = 1;
    var ch = U.clamp(30 + B.stat(u, 'chi') - 40 + (t.id === 2 ? 25 : 0) + (t.id >= 7 ? 10 : 0), 10, 92);
    if (E.rnd(100) < ch) {
      b.fires[x + ',' + y] = 3;
      var v = B.unitAt(b, x, y);
      var msg = '火計成功！';
      if (v) {
        var dmg = Math.round(v.troops * (0.10 + B.stat(u, 'chi') / 900));
        v.troops -= dmg; v.morale = U.clamp(v.morale - 14, 0, 100);
        msg += '　' + v.name + '隊' + U.num(dmg) + 'を焼く。';
        B.checkDead(b, v);
      }
      b.log.push({ t: u.name + 'の火計！ ' + msg, k: u.side === 0 ? 'atk' : 'def' });
      B.checkOver(b);
      return { ok: true, msg: msg };
    }
    b.log.push({ t: u.name + 'は火を放とうとしたが失敗した。', k: '' });
    return { ok: true, msg: '火計は失敗した。（成功率' + ch + '%）' };
  };

  B.taunt = function (b, u, t) {
    if (u.acted) return { ok: false, msg: '行動済みです。' };
    if (B.dist(u, t) > 4) return { ok: false, msg: '遠すぎます。' };
    u.acted = 1; u.mp = 0;
    var ch = U.clamp(40 + B.stat(u, 'chi') - B.stat(t, 'chi') - t.morale / 4, 8, 90);
    if (E.rnd(100) < ch) {

    if (!targets.length) return null;
    targets.sort(function (a, b) { return a.g.loyalty - b.g.loyalty; });

  /* --------------------------- 外交 ---------------------------------- */
  function diplomacy(clan) {
    if (E.rng() > 0.30) return;

    var mine = E.clanPower(clan.id);
    var neighbors = {};
    E.provsOf(clan.id).forEach(function (p) {
      p.adj.forEach(function (i) {
        var q = E.prov(i);
        if (q.owner != null && q.owner !== clan.id) neighbors[q.owner] = true;

    });
    var best = null, bs = 0;
    Object.keys(neighbors).forEach(function (k) {

      var pw = E.clanPower(cid);
      var sc = pw / Math.max(1, mine);
      if (sc > bs) { bs = sc; best = cid; }
    });
    if (best == null) return;
    /* 自分より強い隣国とは手を結ぶ */
    if (bs > 1.25 || (clan.personality === 'loyal' && bs > 0.9)) {
      var envoy = pick(cap, 'sei', '弁舌');
      if (envoy && cap.acted < cap.actMax) {

  /* --------------------------- 出陣判断 ------------------------------ */
  function planAttack(p, clan) {
    if (p.acted >= p.actMax) return null;

    if (!men.length) return null;

    var lord = E.lordOf(clan.id);

      '　鉄砲 <b>' + U.num(p.guns) + '</b>' +
      '　馬 <b>' + U.num(p.horses) + '</b>' +
      (p.port ? '　<b>港</b>' : '') + (p.mine ? '　<b>金山</b>' : '') +
      (p.gunLand ? '　<b>鉄砲鍛冶</b>' : '') + (p.horseLand ? '　<b>馬産地</b>' : '') +
      (p.ikki > 0 ? '　<b style="color:#f0a49a">一揆</b>' : '');
    box.appendChild(sub);

    /* 武将一覧 */
    var men = E.gensIn(p.id).filter(function (g) { return g.clanId === p.owner; });
    var frees = E.freeGensIn(p.id);
    var caps = st.generals.filter(function (g) { return g.status === 'captive' && g.provId === p.id; });
    var gl = el('div', 'glist');
    if (men.length) gl.appendChild(el('div', 'ghead', '在城の武将'));
    men.forEach(function (g) { gl.appendChild(genRow(g, p)); });
    if (frees.length) gl.appendChild(el('div', 'ghead', '在野の者'));
    frees.forEach(function (g) {
      var r = genRow(g, p);
      r.classList.add('free');
      r.querySelector('.loy').textContent = g.found ? '在野' : '？';
      gl.appendChild(r);
    });
    if (caps.length) gl.appendChild(el('div', 'ghead', '捕虜'));
    caps.forEach(function (g) {
      var r = genRow(g, p);
      r.querySelector('.loy').textContent = '捕虜';
      gl.appendChild(r);
    });
    if (!men.length && !frees.length) gl.appendChild(el('div', 'grow-row dim', '　武将はいない'));
    box.appendChild(gl);

    if (mine) box.appendChild(commandPanel(p));
    else if (c) {
      var info = el('div', 'pad dim');
      info.innerHTML = '<b>' + c.name + '家</b>　当主：' + (E.gen(c.lordId) ? E.gen(c.lordId).name : '—') +
        '<br>領国 ' + E.provsOf(c.id).length + 'か国　' +
        (E.allied(st.playerClan, c.id) ? '<span style="color:#8fd6a4">同盟中</span>' : '') +
        '<br><br>隣接する自国から〈出陣〉〈計略〉を行えます。';
      box.appendChild(info);
    }
  };

  function genRow(g, p) {
    var st = S();
    var r = el('div', 'grow-row');
    var c = E.clan(g.clanId);
    if (c && c.lordId === g.id) r.classList.add('lordrow');
    if (p && p.lordGen === g.id) r.classList.add('lordrow');
    var nm = el('div', 'nm', g.name);
    r.appendChild(nm);
    var kv = el('div', 'kv', '政' + E.stat(g, 'sei') + ' 戦' + E.stat(g, 'sen') + ' 智' + E.stat(g, 'chi') + ' 教' + E.stat(g, 'edu'));
    r.appendChild(kv);
    if (g.skills.length) r.appendChild(el('div', 'sk', g.skills.join('･')));
    var loy = el('div', 'loy', g.status === 'active' ? ('忠' + Math.round(g.loyalty)) : '');
    r.appendChild(loy);
    r.onclick = function () { UI.generalCard(g); };
    return r;
  }

  UI.generalCard = function (g) {
    var st = S(), c = E.clan(g.clanId);
    var items = g.items.map(function (i) { return st.treasures[i].name + '（' + st.treasures[i].kind + '）'; });
    var html = '<table class="tbl">' +
      '<tr><th>家</th><td>' + (c ? c.name + '家' : (g.status === 'free' ? '在野' : g.status === 'captive' ? '捕虜' : '—')) + '</td>' +
      '<th>年齢</th><td>' + E.age(g) + '歳</td></tr>' +
      '<tr><th>政治</th><td class="n">' + E.stat(g, 'sei') + '</td><th>戦闘</th><td class="n">' + E.stat(g, 'sen') + '</td></tr>' +
      '<tr><th>智謀</th><td class="n">' + E.stat(g, 'chi') + '</td><th>魅力</th><td class="n">' + E.stat(g, 'cha') + '</td></tr>' +
      '<tr><th>教養</th><td class="n">' + E.stat(g, 'edu') + '</td><th>野望</th><td class="n">' + g.amb + '</td></tr>' +
      '<tr><th>義理</th><td class="n">' + g.giri + '</td><th>忠誠</th><td class="n">' + (g.status === 'active' ? Math.round(g.loyalty) : '—') + '</td></tr>' +
      '<tr><th>特技</th><td colspan="3">' + (g.skills.join('・') || 'なし') + '</td></tr>' +
      '<tr><th>所持</th><td colspan="3">' + (items.join('、') || 'なし') + '</td></tr>' +
      '</table>';
    UI.modal({ title: g.name, body: html });
  };

  /* --------------------------- コマンド盤 ---------------------------- */
  function commandPanel(p) {
    var wrap = el('div', 'cmd-groups');
    var groups = {};
    C.list.forEach(function (cd) {
      (groups[cd.grp] = groups[cd.grp] || []).push(cd);
    });
    var order = ['内政', '軍事', '文化', '人事', '外交', '計略'];
    var canAct = p.acted < p.actMax;
    order.forEach(function (grp) {
      var g = el('div', 'cmd-grp');
      g.appendChild(el('h4', '', grp));
      var btns = el('div', 'cmd-btns');
      groups[grp].forEach(function (cd) {
        var b = el('button', 'cmd' + (cd.id === 'shutsujin' ? ' hot' : ''), cd.name);
        b.title = cd.desc + (cd.gold ? '（' + cd.gold + '貫）' : '');
        b.disabled = !canAct;
        b.onclick = function () { UI.command(cd.id, p); };
        btns.appendChild(b);
      });
      g.appendChild(btns);
      wrap.appendChild(g);
    });
    if (!canAct) {
      var n = el('p', 'dim', 'この国は今季の命令を使い切りました。');
      n.style.padding = '0 2px'; wrap.appendChild(n);
    }
    return wrap;
  }

  /* ====================== コマンドのダイアログ ======================= */
  function menOf(p) {
    return E.gensIn(p.id).filter(function (g) { return g.clanId === p.owner; });
  }

  function pickGeneralUI(list, opt, cb) {
    var body = el('div');
    if (opt.note) { var n = el('p', 'hint', opt.note); body.appendChild(n); }
    var pl = el('div', 'pick-list');
    if (!list.length) pl.appendChild(el('p', 'dim', '該当する者がいません。'));
    list.forEach(function (g) {
      var d = el('div', 'pick');
      d.appendChild(el('div', 'nm', g.name));
      d.appendChild(el('div', 'kv', '政' + E.stat(g, 'sei') + ' 戦' + E.stat(g, 'sen') + ' 智' + E.stat(g, 'chi') +
        ' 魅' + E.stat(g, 'cha') + ' 教' + E.stat(g, 'edu') + (g.skills.length ? '　' + g.skills.join('･') : '')));
      if (opt.rate) d.appendChild(el('div', 'rr', opt.rate(g)));
      d.onclick = function () { UI.closeModal(); cb(g); };
      pl.appendChild(d);
    });
    body.appendChild(pl);
    UI.modal({ title: opt.title, body: body, buttons: [{ label: 'やめる' }] });
  }
  UI.pickGeneral = pickGeneralUI;

  function bestFor(p, key, skill) {
    var men = menOf(p).slice();
    men.sort(function (a, b) {
      return (E.stat(b, key) + (skill && E.has(b, skill) ? 22 : 0)) - (E.stat(a, key) + (skill && E.has(a, skill) ? 22 : 0));
    });
    return men;
  }

  function run(res, p) {
    if (!res) return;
    UI.toast(res.msg, res.ok ? 'good' : 'bad');
    if (res.ok) E.log(res.msg, '');
    else E.log(res.msg, 'bad');
    UI.renderTop(); UI.renderMap(); UI.renderSide();
  }
  UI.run = run;

  function amountDialog(opt, cb) {
    var body = el('div');
    if (opt.note) body.appendChild(el('p', 'hint', opt.note));
    var f = el('div', 'field');
    f.appendChild(el('label', '', opt.label));
    var rangeI = el('input'); rangeI.type = 'range';
    rangeI.min = opt.min || 0; rangeI.max = opt.max; rangeI.value = opt.value != null ? opt.value : opt.max;
    var numI = el('input'); numI.type = 'number';
    numI.min = opt.min || 0; numI.max = opt.max; numI.value = rangeI.value;
    var info = el('div', 'hint');
    function upd(v) {
      v = U.clamp(Math.round(v), opt.min || 0, opt.max);
      rangeI.value = v; numI.value = v;
      if (opt.info) info.textContent = opt.info(v);
    }
    rangeI.oninput = function () { upd(+rangeI.value); };
    numI.oninput = function () { upd(+numI.value); };
    f.appendChild(rangeI); f.appendChild(numI);
    body.appendChild(f); body.appendChild(info);
    upd(+rangeI.value);
    UI.modal({
      title: opt.title, body: body,
      buttons: [{ label: 'やめる' }, {
        label: '決定', cls: 'primary', action: function () { cb(+numI.value); }
      }]
    });
  }
  UI.amountDialog = amountDialog;

  UI.command = function (id, p) {
    var st = S();
    var cd = null;
    C.list.forEach(function (x) { if (x.id === id) cd = x; });
    if (p.acted >= p.actMax) { UI.toast('この国はもう動けません。', 'bad'); return; }

    switch (id) {
      case 'kaikon': case 'chisui': case 'shogyo': case 'fushin':
        pickGeneralUI(bestFor(p, 'sei', id === 'fushin' ? '築城' : '内政'),
          { title: cd.name + '　—　担当を選ぶ', note: cd.desc + '（' + cd.gold + '貫）' },
          function (g) { run(C.exec(id, p, g), p); });
        return;
      case 'hodokoshi':
        pickGeneralUI(bestFor(p, 'cha'), { title: '施し　—　担当を選ぶ', note: '民に金を施し、民忠を上げます。（200貫）' },
          function (g) { run(C.hodokoshi(p, g), p); });
        return;
      case 'kunren':
        pickGeneralUI(bestFor(p, 'sen', '騎馬'), { title: '訓練　—　担当を選ぶ', note: '兵を鍛えます。（120貫）' },
          function (g) { run(C.kunren(p, g), p); });
        return;
      case 'gijutsu':
        pickGeneralUI(bestFor(p, 'chi', '鉄砲'), { title: '技術振興　—　担当を選ぶ', note: '鉄砲鍛冶を招き、技術を上げます。（400貫）' },
          function (g) { run(C.gijutsu(p, g), p); });
        return;
      case 'bunka':
        pickGeneralUI(bestFor(p, 'edu', '茶道'), { title: '文化振興　—　担当を選ぶ', note: '連歌・能・茶を興します。（400貫）' },
          function (g) { run(C.bunka(p, g), p); });
        return;
      case 'tansaku':
        pickGeneralUI(bestFor(p, 'chi', '忍法'), { title: '探索　—　担当を選ぶ', note: '人材・宝物・隠し田を探します。（100貫）' },
          function (g) { run(C.tansaku(p, g), p); });
        return;
      case 'chohei': {
        var mx = C.choheiMax(p);
        if (mx <= 0) { UI.toast('これ以上兵は集まりません。', 'bad'); return; }
        amountDialog({
          title: '徴兵', label: '兵数', max: mx, value: Math.min(mx, Math.floor(p.gold / 0.14)),
          note: '民忠が下がります。1人あたり0.14貫。',
          info: function (v) { return '費用 ' + U.num(Math.round(v * 0.14)) + '貫　／　所持金 ' + U.num(p.gold) + '貫'; }
        }, function (n) {
          pickGeneralUI(bestFor(p, 'cha'), { title: '徴兵　—　担当を選ぶ' }, function (g) { run(C.chohei(p, g, n), p); });
        });
        return;
      }
      case 'buygun': {
        var price = C.gunPrice(p), mxg = Math.min(E.maxGun(p) - p.guns, Math.floor(p.gold / price));
        if (mxg <= 0) { UI.toast('買えません。', 'bad'); return; }
        amountDialog({
          title: '鉄砲購入', label: '挺数', max: mxg,
          note: '1挺' + price + '貫' + (p.gunLand ? '（鉄砲鍛冶のある国は安い）' : '') + '。技術が高いほど安く手に入ります。',
          info: function (v) { return '費用 ' + U.num(v * price) + '貫'; }
        }, function (n) {
          pickGeneralUI(bestFor(p, 'sen', '鉄砲'), { title: '鉄砲購入　—　担当を選ぶ' }, function (g) { run(C.buygun(p, g, n), p); });
        });
        return;
      }
      case 'buyhorse': {
        var hp = C.horsePrice(p), mxh = Math.min(E.maxHorse(p) - p.horses, Math.floor(p.gold / hp));
        if (mxh <= 0) { UI.toast('買えません。', 'bad'); return; }
        amountDialog({
          title: '軍馬購入', label: '頭数', max: mxh, note: '1頭' + hp + '貫。',
          info: function (v) { return '費用 ' + U.num(v * hp) + '貫'; }
        }, function (n) {
          pickGeneralUI(bestFor(p, 'sen', '騎馬'), { title: '軍馬購入　—　担当を選ぶ' }, function (g) { run(C.buyhorse(p, g, n), p); });
        });
        return;
      }
      case 'buyrice': {
        var rp = st.ricePrice, mxr = Math.floor(p.gold * 100 / rp);
        if (mxr <= 0) { UI.toast('金がありません。', 'bad'); return; }
        amountDialog({
          title: '兵糧購入', label: '石数', max: mxr, note: '相場：100石あたり' + rp + '貫',
          info: function (v) { return '費用 ' + U.num(Math.round(v * rp / 100)) + '貫'; }
        }, function (n) { run(C.buyrice(p, menOf(p)[0], n), p); });
        return;
      }
      case 'sellrice': {
        amountDialog({
          title: '兵糧売却', label: '石数', max: p.rice, value: Math.round(p.rice / 3),
          note: '相場：100石あたり' + Math.round(st.ricePrice * 0.9) + '貫（売値）',
          info: function (v) { return '収入 ' + U.num(Math.round(v * st.ricePrice * 0.9 / 100)) + '貫'; }
        }, function (n) { run(C.sellrice(p, menOf(p)[0], n), p); });
        return;
      }
      case 'chakai': {
        var hosts = menOf(p).filter(function (g) { return C.bestTeaware(g); });
        if (!hosts.length) { UI.toast('茶器を持つ者がいません。（探索や褒美で手に入ります）', 'bad'); return; }
        if (p.culture < 25) { UI.toast('この国は文化が低く、茶会を開けません。', 'bad'); return; }
        pickGeneralUI(hosts, {
          title: '茶会　—　亭主を選ぶ',
          note: '茶器と教養に応じ、同じ国にいる家臣の忠誠が上がります。（150貫）',
          rate: function (g) { return C.bestTeaware(g).name; }
        }, function (g) { run(C.chakai(p, g), p); });
        return;
      }
      case 'touyou': {
        var frees = E.freeGensIn(p.id);
        if (!frees.length) { UI.toast('この国に在野の武将はいません。', 'bad'); return; }
        var envoys = bestFor(p, 'cha', '弁舌');
        if (!envoys.length) { UI.toast('使者に立つ者がいません。', 'bad'); return; }
        pickGeneralUI(frees, {
          title: '登用　—　誰を招く', note: '（200貫）　※探索で見つけていない者は成功率が読めません',
          rate: function (g) { return g.found ? C.touyouChance(p, envoys[0], g) + '%' : '？'; }
        }, function (t) {
          pickGeneralUI(envoys, {
            title: '登用　—　使者を選ぶ',
            rate: function (g) { return C.touyouChance(p, g, t) + '%'; }
          }, function (g) { run(C.touyou(p, g, t), p); });
        });
        return;
      }
      case 'houbi': {
        var men = menOf(p).filter(function (g) { return g.id !== E.clan(p.owner).lordId; });
        if (!men.length) { UI.toast('対象がいません。', 'bad'); return; }
        pickGeneralUI(men, {
          title: '褒美　—　誰に与える', note: '金または宝物を与えて忠誠を高めます。',
          rate: function (g) { return '忠' + Math.round(g.loyalty); }
        }, function (t) { UI.houbiDialog(p, t); });
        return;
      }
      case 'jouzu': {
        pickGeneralUI(menOf(p), {
          title: '城主任命', note: '城主の政治力は収入・収穫に、戦闘力は守りに影響します。',
          rate: function (g) { return g.id === p.lordGen ? '現城主' : ''; }
        }, function (t) { run(C.jouzu(p, t), p); });
        return;
      }
      case 'tsuihou': {
        var men2 = menOf(p).filter(function (g) { return g.id !== E.clan(p.owner).lordId; });
        pickGeneralUI(men2, { title: '追放', note: '追放した武将は在野となり、所持する宝物も失われます。' },
          function (t) {
            UI.confirm('追放', t.name + 'を追放しますか。', function () { run(C.tsuihou(p, t), p); }, '追放する');
          });
        return;
      }
      case 'idou': {
        var dests = p.adj.filter(function (i) { return E.prov(i).owner === p.owner; });
        if (!dests.length) { UI.toast('隣接する自国がありません。', 'bad'); return; }
        pickGeneralUI(menOf(p), { title: '移動　—　誰を移す' }, function (g) {
          UI.pickProvince(dests, '移動先を選ぶ', function (to) { run(C.idou(p, g, to), p); });
        });
        return;
      }
      case 'yusou': {
        var d2 = p.adj.filter(function (i) { return E.prov(i).owner === p.owner; });
        if (!d2.length) { UI.toast('隣接する自国がありません。', 'bad'); return; }
        UI.pickProvince(d2, '輸送先を選ぶ', function (to) { UI.yusouDialog(p, to); });
        return;
      }
      case 'doumei': case 'enjo': case 'haki': {
        UI.diplomacyDialog(p, id);
        return;
      }
      case 'choutei': {
        var cc = E.clan(p.owner);
        if (cc.courtRank >= 5) { UI.toast('これ以上の官位はありません。', 'bad'); return; }
        amountDialog({
          title: '朝廷工作', label: '献金', max: p.gold, value: Math.min(p.gold, 800 + cc.courtRank * 900),
          note: '官位を得ると民忠・登用・外交に有利になります。山城を領していれば成功しやすくなります。',
          info: function (v) { return '献金 ' + U.num(v) + '貫'; }
        }, function (n) {
          pickGeneralUI(bestFor(p, 'cha', '弁舌'), { title: '朝廷工作　—　使者を選ぶ' },
            function (g) { run(C.choutei(p, g, n), p); });
        });
        return;
      }
      case 'ryugen': case 'sendou': case 'baishuu': {
        var tgts = p.adj.filter(function (i) {
          var q = E.prov(i);
          return q.owner != null && q.owner !== p.owner && !E.allied(p.owner, q.owner);
        });
        if (!tgts.length) { UI.toast('計略をしかける相手がいません。', 'bad'); return; }
        UI.pickProvince(tgts, cd.name + '　—　どの国に', function (to) { UI.plotDialog(p, to, id); });
        return;
      }
      case 'shutsujin': {
        var atk = p.adj.filter(function (i) { return !B.canAttack(p, E.prov(i)); });
        if (!atk.length) { UI.toast('攻め込める国がありません。', 'bad'); return; }
        UI.pickProvince(atk, '出陣　—　攻め込む国', function (to) { UI.shutsujinDialog(p, to); });
        return;
      }
    }
  };

  /* 国の選択（地図から） */
  UI.pickProvince = function (ids, hint, cb) {
    mode = { targets: ids, hint: hint + '（地図から選ぶ／右クリックで取消）', cb: cb };

    UI.toast(hint, '');

  UI.pickTarget = function (id) {
    if (!mode) return;
    if (mode.targets.indexOf(id) < 0) { UI.toast('選べません。', 'bad'); return; }

    UI.renderMap();

  /* --------------------------- 褒美 ---------------------------------- */
  UI.houbiDialog = function (p, t) {
    var st = S();
    var giver = E.gen(p.lordGen) || menOf(p)[0];
    var body = el('div');
    body.appendChild(el('p', 'hint', t.name + '　忠誠 ' + Math.round(t.loyalty)));
    var tabs = el('div', 'field');
    var gold = el('button', 'btn sm primary', '金を与える');
    var item = el('button', 'btn sm', '宝物を与える');
    tabs.appendChild(gold); tabs.appendChild(item);
    body.appendChild(tabs);
    var area = el('div');
    body.appendChild(area);

    function goldView() {
      area.innerHTML = '';
      var f = el('div', 'field');
      f.appendChild(el('label', '', '金'));
      var r = el('input'); r.type = 'range'; r.min = 0; r.max = p.gold; r.value = Math.min(p.gold, 600);
      var n = el('input'); n.type = 'number'; n.min = 0; n.max = p.gold; n.value = r.value;
      var inf = el('div', 'hint');
      function upd(v) {
        v = U.clamp(Math.round(v), 0, p.gold); r.value = v; n.value = v;
        inf.textContent = '忠誠 +' + U.clamp(Math.round(v / 60 + (giver.cha - 50) / 20), 0, 26);
      }
      r.oninput = function () { upd(+r.value); }; n.oninput = function () { upd(+n.value); };
      f.appendChild(r); f.appendChild(n);
      area.appendChild(f); area.appendChild(inf); upd(+r.value);
      area._get = function () { return +n.value; };
      area._mode = 'gold';
    }
    function itemView() {
      area.innerHTML = '';
      area._mode = 'item';
      var owned = [];
      menOf(p).forEach(function (g) {

  UI.shutsujinDialog = function (p, toId) {
    var q = E.prov(toId);
    var men = menOf(p);
    if (!men.length) { UI.toast('武将がいません。', 'bad'); return; }
    men = men.slice().sort(function (a, b) { return E.stat(b, 'sen') - E.stat(a, 'sen'); });
    var chosen = {}, troops = {}, types = {};
    men.slice(0, Math.min(5, men.length)).forEach(function (g) { chosen[g.id] = true; });

    var body = el('div');
    var head = el('p', 'hint');
    body.appendChild(head);
    var pl = el('div', 'pick-list');
    body.appendChild(pl);

    var ctl = el('div');
    body.appendChild(ctl);
    var totalF = el('div', 'field');
    totalF.appendChild(el('label', '', '出陣兵数'));
    var tr = el('input'); tr.type = 'range'; tr.min = 0; tr.max = Math.max(0, p.hei - 100);
    tr.value = Math.round(Math.max(0, p.hei - 100) * 0.8);
    var tn = el('input'); tn.type = 'number'; tn.min = 0; tn.max = tr.max; tn.value = tr.value;
    totalF.appendChild(tr); totalF.appendChild(tn);
    ctl.appendChild(totalF);
    var riceF = el('div', 'field');
    riceF.appendChild(el('label', '', '兵糧'));
    var rr = el('input'); rr.type = 'range'; rr.min = 0; rr.max = p.rice;
    var rn = el('input'); rn.type = 'number'; rn.min = 0; rn.max = p.rice;
    riceF.appendChild(rr); riceF.appendChild(rn);
    ctl.appendChild(riceF);
    var summary = el('div', 'hint');
    ctl.appendChild(summary);

    function counts() {
      var n = 0; men.forEach(function (g) { if (chosen[g.id]) n++; });
      return n;
    }
    function autoRice() {
      var t = +tn.value;
      var v = Math.min(p.rice, Math.round(t / 5.5) + 400);
      rr.value = v; rn.value = v;
    }
    function distribute() {
      var t = +tn.value, list = men.filter(function (g) { return chosen[g.id]; });
      var each = list.length ? Math.floor(t / list.length) : 0;
      var gunsLeft = p.guns, horseLeft = p.horses;
      list.forEach(function (g, i) {
        troops[g.id] = each;
        if (types[g.id] === undefined) {
          if (E.has(g, '鉄砲')) types[g.id] = '鉄砲';
          else if (E.has(g, '騎馬')) types[g.id] = '騎馬';
          else types[g.id] = i % 3 === 1 ? '鉄砲' : (i % 3 === 2 ? '騎馬' : '足軽');
        }
      });
      /* 装備の充足を確認 */
      var needGun = 0, needHorse = 0;
      list.forEach(function (g) {
        if (types[g.id] === '鉄砲') needGun += Math.round(troops[g.id] / 3);
        if (types[g.id] === '騎馬') needHorse += Math.round(troops[g.id] / 4);
      });
      list.forEach(function (g) {
        if (types[g.id] === '鉄砲' && needGun > p.guns) types[g.id] = '足軽';
        if (types[g.id] === '騎馬' && needHorse > p.horses) types[g.id] = '足軽';
      });
      needGun = 0; needHorse = 0;
      list.forEach(function (g) {
        if (types[g.id] === '鉄砲') needGun += Math.round(troops[g.id] / 3);
        if (types[g.id] === '騎馬') needHorse += Math.round(troops[g.id] / 4);
      });
      summary.innerHTML = '大将 <b>' + (list[0] ? list[0].name : '—') + '</b>　部隊 ' + list.length + '　' +
        '一隊 ' + U.num(each) + '人<br>' +
        '必要な鉄砲 ' + U.num(needGun) + '／' + U.num(p.guns) + '　必要な馬 ' + U.num(needHorse) + '／' + U.num(p.horses) +
        '<br>兵糧は1ターンごとに減ります。少ないと士気が崩れます。';
      renderList();
    }
    function renderList() {
      pl.innerHTML = '';
      men.forEach(function (g) {
        var d = el('div', 'pick' + (chosen[g.id] ? ' on' : ''));
        d.appendChild(el('div', 'nm', g.name));
        d.appendChild(el('div', 'kv', '戦' + E.stat(g, 'sen') + ' 智' + E.stat(g, 'chi') +
          (g.skills.length ? '　' + g.skills.join('･') : '')));
        if (chosen[g.id]) {
          var s = el('select');
          ['足軽', '騎馬', '鉄砲'].forEach(function (t) {
            var o = el('option', '', t); o.value = t;
            if (types[g.id] === t) o.selected = true;
            s.appendChild(o);
          });
          s.onclick = function (e) { e.stopPropagation(); };
          s.onchange = function () { types[g.id] = s.value; distribute(); };
          var rr2 = el('div', 'rr', U.num(troops[g.id] || 0) + '人');
          d.appendChild(s); d.appendChild(rr2);
        }
        d.onclick = function () {
          if (chosen[g.id]) { if (counts() <= 1) { UI.toast('最低ひとりは要ります。', 'bad'); return; } delete chosen[g.id]; }
          else { if (counts() >= 8) { UI.toast('八隊までです。', 'bad'); return; } chosen[g.id] = true; }
          distribute();
        };
        pl.appendChild(d);
      });
    }
    tr.oninput = function () { tn.value = tr.value; autoRice(); distribute(); };
    tn.oninput = function () { tr.value = tn.value; autoRice(); distribute(); };
    rr.oninput = function () { rn.value = rr.value; };
    rn.oninput = function () { rr.value = rn.value; };

    var defMen = E.gensIn(q.id).filter(function (g) { return g.clanId === q.owner; });
    head.innerHTML = '<b>' + p.name + '</b> より <b>' + q.name + '</b>（' +
      (q.owner != null ? E.clan(q.owner).name + '家' : '無主') + '）へ<br>' +
      '敵：兵 <b>' + U.num(q.hei) + '</b>　訓練 ' + q.training + '　城 ' + q.castleLv +
      '　鉄砲 ' + U.num(q.guns) + '　武将 ' + defMen.length + '人' +
      (defMen.length ? '（' + defMen.slice(0, 5).map(function (g) { return g.name; }).join('、') + '）' : '') +
      (p.sea.indexOf(toId) >= 0 ? '<br><span style="color:#f0a49a">海を越える攻撃です</span>' : '');
    autoRice(); distribute();

    UI.modal({
      title: '出陣', body: body, buttons: [
        { label: 'やめる' },
        {
          label: '出陣！', cls: 'primary', action: function () {
            var list = men.filter(function (g) { return chosen[g.id]; });
            var total = +tn.value, rice = +rn.value;
            if (total < 100) { UI.toast('兵が少なすぎます。', 'bad'); return false; }
            if (!list.length) { UI.toast('武将を選んでください。', 'bad'); return false; }
            var force = {
              gens: list.map(function (g) { return { gen: g, troops: troops[g.id], type: types[g.id] }; }),
              rice: rice
            };
            p.hei -= total; p.rice -= rice; p.acted = p.actMax;
            var b = B.create(p, q, force, {});
            UI.closeModal();
            NB.battleUI.open(b, 0);
          }
        }
      ]
    });
  };

  function openSetup() {
    UI.show('setup');
    var list = $('#scenarioList');
    list.innerHTML = '';
    NB.DATA.scenarios.forEach(function (s) {
      var d = el('div', 'scn' + (s.id === setup.scenario ? ' on' : ''));
      d.innerHTML = '<h3>' + s.name + '</h3><div class="yr">' + s.year + '年 ' + NB.DATA.seasons[s.season || 0] + '</div><p>' + s.caption + '</p>';
      d.onclick = function () {
        setup.scenario = s.id; setup.clan = null;
        $$('.scn', list).forEach(function (x) { x.classList.remove('on'); });
        d.classList.add('on');
        renderClanList();
        $('#clanDetail').innerHTML = '<p class="dim">大名家を選んでください。</p>';
        $('#startBtn').disabled = true;
      };
      list.appendChild(d);
    });
    renderClanList();
  }

  function scenarioData() {
    var sc = null;
    NB.DATA.scenarios.forEach(function (s) { if (s.id === setup.scenario) sc = s; });
    return sc;
  }

  function renderClanList() {
    var sc = scenarioData(), box = $('#clanList');
    box.innerHTML = '';
    var clans = sc.clans.slice();
    clans.sort(function (a, b) { return b.provs.length - a.provs.length; });
    clans.forEach(function (c) {
      var d = el('div', 'clan-chip');
      var sw = el('div', 'sw'); sw.style.background = c.color;
      d.appendChild(sw);
      d.appendChild(el('b', '', c.name));
      d.appendChild(el('i', '', c.provs.length + '国'));
      d.onclick = function () {
        setup.clan = c.name;
        $$('.clan-chip', box).forEach(function (x) { x.classList.remove('on'); });
        d.classList.add('on');
        showClanDetail(c);
        $('#startBtn').disabled = false;
      };
      box.appendChild(d);
    });
  }

  function showClanDetail(c) {
    var sc = scenarioData();
    var lordRow = null;
    NB.DATA.generalTable.trim().split('\n').forEach(function (l) {
      var f = l.split('|');
      if (f[0] === c.lord) lordRow = f;
    });
    var maxP = 0;
    sc.clans.forEach(function (x) { maxP = Math.max(maxP, x.provs.length); });
    var members = c.men.length + 1;
    var diffScore = c.provs.length * 2 + members * 0.3;
    var stars = diffScore > 14 ? 1 : diffScore > 8 ? 2 : diffScore > 5 ? 3 : diffScore > 3 ? 4 : 5;
    var box = $('#clanDetail');
    box.innerHTML =
      '<h3>' + c.name + '家</h3>' +
      '<p class="dim">当主　' + c.lord + (lordRow ? '（' + (sc.year - (+lordRow[8])) + '歳）' : '') + '</p>' +
      (lordRow ? '<table class="tbl">' +
        '<tr><th>政治</th><td class="n">' + lordRow[1] + '</td><th>戦闘</th><td class="n">' + lordRow[2] + '</td></tr>' +
        '<tr><th>智謀</th><td class="n">' + lordRow[3] + '</td><th>魅力</th><td class="n">' + lordRow[4] + '</td></tr>' +
        '<tr><th>野望</th><td class="n">' + lordRow[5] + '</td><th>教養</th><td class="n">' + lordRow[7] + '</td></tr>' +
        '</table>' : '') +
      '<p style="margin-top:9px">領国　' + c.provs.join('・') + '</p>' +
      '<p class="dim">家臣 ' + c.men.length + '人</p>' +
      '<p class="diff">難易度　<span style="color:var(--gold2);letter-spacing:2px">' + '★'.repeat(stars) + '☆'.repeat(5 - stars) + '</span></p>';
  }

  function startGame() {
    if (!setup.clan) return;
    E.newGame(setup.scenario, setup.clan, Math.floor(Math.random() * 1e9));
    UI.show('game');
    UI.buildMap();
    var st = E.getState();
    var cap = E.clan(st.playerClan).capital;
    UI.renderAll();
    setTimeout(function () { UI.centerOn(cap); UI.clickProv(cap); }, 30);
    UI.toast('天下は乱れ、家々が競い合う。', '');
  }

  /* ============================ 進行 ================================= */
  function endTurn() {
    var st = E.getState();
    var left = E.provsOf(st.playerClan).filter(function (p) { return p.acted < p.actMax; });
    if (left.length) {
      UI.confirm('季節を終える',
        'まだ命令を出していない国が ' + left.length + ' か国あります（' +
        left.slice(0, 6).map(function (p) { return p.name; }).join('、') + (left.length > 6 ? ' ほか' : '') + '）。<br>このまま季節を終えますか。',
        function () { runAI(); }, '終える');
      return;
    }
    runAI();
  }

  function runAI() {
    $('#endTurnBtn').disabled = true;
    AI.begin();
    processAI();
  }

  function processAI() {
    var battle = AI.run();
    if (battle) {
      UI.toast(E.clan(battle.atkClan).name + '家が' + E.prov(battle.prov).name + 'に攻め寄せた！', 'bad');
      setTimeout(function () {
        NB.battleUI.open(battle, 1, function () {
          if (E.getState().ended) { finishGame(); return; }
          processAI();
        });
      }, 500);
      return;
    }
    E.endSeason();
    UI.renderAll();
    $('#endTurnBtn').disabled = false;
    var st = E.getState();
    if (st.ended) { finishGame(); return; }
    if (st.season === 0) UI.toast(st.year + '年。新しい年が明けた。', '');
    autosave();
  }

  function finishGame() {
    var st = E.getState();
    var win = st.over === 'win';
    var c = E.clan(st.playerClan);
    UI.modal({
      title: win ? '天下統一' : '落城',
      body: win
        ? '<p class="hint" style="font-size:15px;line-height:2.2">' + st.year + '年、' + c.name + '家は日ノ本六十余州をことごとく従えた。<br>乱世は終わり、そなたの名は千年のちまで語り継がれる。</p>'
        : '<p class="hint" style="font-size:15px;line-height:2.2">' + st.year + '年、' + c.name + '家は滅びた。<br>——されど、それもまた戦国の習いである。</p>',
      buttons: [{
        label: 'タイトルへ', cls: 'primary', action: function () {
          try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
          UI.show('title');
        }
      }]
    });
  }

  /* ============================ 記録 ================================= */
  function autosave() {
    try { localStorage.setItem(SAVE_KEY, E.serialize()); } catch (e) {}
  }
  function saveDialog() {
    var okSave = true;
    try { localStorage.setItem(SAVE_KEY, E.serialize()); } catch (e) { okSave = false; }
    var st = E.getState();
    UI.modal({
      title: '記録',
      body: okSave
        ? '<p>' + st.year + '年' + NB.DATA.seasons[st.season] + '、' + E.clan(st.playerClan).name + '家の様子を書き留めた。</p>' +
          '<p class="hint">季節が変わるたびに自動でも記録されます。タイトル画面の〈続きから〉で再開できます。</p>'
        : '<p>記録できませんでした。（ブラウザの設定をご確認ください）</p>',
      buttons: [{ label: '閉じる', cls: 'primary' }]
    });
  }
  function loadGame() {
    var raw = null;
    try { raw = localStorage.getItem(SAVE_KEY); } catch (e) {}
    if (!raw) { UI.toast('記録がありません。', 'bad'); return; }
    try {
      E.deserialize(raw);
    } catch (e) {
      UI.toast('記録を読み込めませんでした。', 'bad'); return;
    }
    UI.show('game');
    UI.buildMap();
    UI.renderAll();
    var st = E.getState();
    var cap = E.clan(st.playerClan).capital;
    setTimeout(function () { if (cap >= 0) { UI.centerOn(cap); UI.clickProv(cap); } }, 30);
    UI.toast('記録から再開しました。', 'good');
  }

  /* ============================ 起動 ================================= */
  function bindGame() {
    $('#endTurnBtn').onclick = endTurn;
    $$('#topbar [data-act]').forEach(function (b) {
      b.onclick = function () {
        var a = b.dataset.act;
        if (a === 'ranking') UI.ranking();
        else if (a === 'retainers') UI.retainers();
        else if (a === 'save') saveDialog();
        else if (a === 'help') UI.help();
      };
    });
    $$('#mapctl [data-act]').forEach(function (b) {
      b.onclick = function () {
        var a = b.dataset.act;
        if (a === 'zoomin') UI.zoomBy(1.2);
        else if (a === 'zoomout') UI.zoomBy(0.83);
        else UI.fit();
      };
    });
    $('#sideToggle').onclick = function () { $('#side').classList.toggle('open'); };
    UI.bindMapControls();
    NB.battleUI.bind();
  }

  function boot() {
    bindTitle();
    bindGame();
    UI.show('title');
    var has = false;
    try { has = !!localStorage.getItem(SAVE_KEY); } catch (e) {}
    if (!has) $('#title [data-act="load"]').disabled = true;
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

})(typeof window !== 'undefined' ? window : globalThis);

</script>
</body>
</html>
