<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; font-family: "Hiragino Kaku Gothic ProN","Yu Gothic Medium","Yu Gothic",Meiryo,system-ui,sans-serif; font-size: 15px; line-height: 1.7; -webkit-font-smoothing: antialiased; }
    a { color: #3F6B52; } a:hover { color: #2F6F4E; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #F1F4EE; color: #22262A; padding: 12px; display: flex; flex-direction: column; gap: 10px; overflow: hidden;">

  <div style="background: #FFFFFF; border: 1px solid #DDE3DA; border-radius: 14px; flex-grow: 1; display: flex; flex-direction: column; overflow: hidden;">

    <div style="padding: 18px 20px 0; display: flex; align-items: baseline; gap: 10px;">
      <div style="font-size: 15px; font-weight: 600; letter-spacing: .02em;">8月26日（水）</div>
      <div style="margin-left: auto; font-size: 12.5px; color: #6B7278;">休肝日</div>
    </div>

    <div style="padding: 6px 20px 0; display: flex; align-items: baseline; gap: 8px;">
      <span style="font-size: 56px; font-weight: 600; line-height: 1; color: #2F6F4E; font-variant-numeric: tabular-nums; letter-spacing: -.01em;">5.8</span>
      <span style="font-size: 19px; color: #6B7278;">g</span>
      <span style="margin-left: auto; font-size: 13px; color: #6B7278; text-align: right;">目標まで<br>あと 0.2g</span>
    </div>

    <div style="padding: 26px 20px 0;">
      <div style="position: relative;">
        <div style="display: flex; gap: 2px; height: 36px; background: #E6EDE3; border-radius: 8px; overflow: hidden;">
          <div style="width: 6.25%; background: #2F6F4E;"></div>
          <div style="width: 39.6%; background: #4A8465;"></div>
          <div style="width: 14.6%; background: #6B9C82;"></div>
        </div>
        <div style="position: absolute; top: -5px; bottom: -5px; left: 62.5%; width: 2px; background: #22262A; opacity: .55;"></div>
        <div style="position: absolute; top: -24px; left: 62.5%; transform: translateX(-50%); font-size: 11.5px; color: #22262A;">6g</div>
      </div>
      <div style="font-size: 12.5px; color: #6B7278; margin-top: 8px;">1食ずつ、左から積み上がります。</div>
    </div>

    <div style="padding: 14px 20px 0; display: flex; flex-direction: column;">
      <div style="display: flex; align-items: baseline; gap: 10px; padding: 9px 0; border-bottom: 1px solid #DDE3DA;">
        <span style="width: 10px; height: 10px; border-radius: 3px; background: #2F6F4E; align-self: center; flex-shrink: 0;"></span>
        <span style="font-size: 12.5px; color: #6B7278; width: 24px;">朝</span>
        <span>冷奴・納豆</span>
        <span style="margin-left: auto; font-weight: 600; font-variant-numeric: tabular-nums;">0.6</span>
      </div>
      <div style="display: flex; align-items: baseline; gap: 10px; padding: 9px 0; border-bottom: 1px solid #DDE3DA;">
        <span style="width: 10px; height: 10px; border-radius: 3px; background: #4A8465; align-self: center; flex-shrink: 0;"></span>
        <span style="font-size: 12.5px; color: #6B7278; width: 24px;">昼</span>
        <span>担々麺と半チャーハン</span>
        <span style="margin-left: auto; font-weight: 600; font-variant-numeric: tabular-nums;">3.8</span>
      </div>
      <div style="display: flex; align-items: baseline; gap: 10px; padding: 9px 0; border-bottom: 1px solid #DDE3DA;">
        <span style="width: 10px; height: 10px; border-radius: 3px; background: #6B9C82; align-self: center; flex-shrink: 0;"></span>
        <span style="font-size: 12.5px; color: #6B7278; width: 24px;">夜</span>
        <span>無塩そば・めかぶ</span>
        <span style="margin-left: auto; font-weight: 600; font-variant-numeric: tabular-nums;">1.4</span>
      </div>
    </div>

    <div style="padding: 16px 20px 0; display: flex; align-items: baseline; gap: 10px;">
      <span style="font-size: 12.5px; color: #6B7278;">朝の血圧</span>
      <span style="font-size: 19px; font-weight: 600; color: #2F6F4E; font-variant-numeric: tabular-nums;">124</span>
      <span style="font-size: 14px; color: #6B7278;">/</span>
      <span style="font-size: 19px; font-weight: 600; color: #2C6FA8; font-variant-numeric: tabular-nums;">83</span>
      <span style="margin-left: auto; font-size: 12.5px; color: #6B7278;">06:48 ・服薬前</span>
    </div>

    <div style="margin-top: auto; padding: 14px 0 0;">
      <div style="font-size: 12.5px; color: #6B7278; padding: 0 20px 8px;">よく食べるもの</div>
      <div style="display: flex; gap: 6px; padding: 0 20px 16px; overflow: hidden;">
        <div style="border: 1px solid #DDE3DA; border-radius: 20px; padding: 8px 13px; font-size: 13px; white-space: nowrap;">味噌汁 <b style="font-variant-numeric: tabular-nums;">1.4</b></div>
        <div style="border: 1px solid #DDE3DA; border-radius: 20px; padding: 8px 13px; font-size: 13px; white-space: nowrap;">定食 <b style="font-variant-numeric: tabular-nums;">4.2</b></div>
        <div style="border: 1px solid #DDE3DA; border-radius: 20px; padding: 8px 13px; font-size: 13px; white-space: nowrap;">納豆 <b style="font-variant-numeric: tabular-nums;">0.4</b></div>
        <div style="border: 1px solid #DDE3DA; border-radius: 20px; padding: 8px 13px; font-size: 13px; white-space: nowrap;">餃子6</div>
      </div>
    </div>

  </div>

  <div style="display: flex; align-items: center; gap: 8px; background: #FFFFFF; border: 1px solid #DDE3DA; border-radius: 26px; padding: 6px 6px 6px 16px; margin-bottom: 10px;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B7278" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;">
      <path d="M3 8.5A1.5 1.5 0 0 1 4.5 7h2.2l1.1-1.8A1.5 1.5 0 0 1 9.1 4.5h5.8a1.5 1.5 0 0 1 1.3.7L17.3 7h2.2A1.5 1.5 0 0 1 21 8.5v9A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5z"></path>
      <circle cx="12" cy="12.6" r="3.4"></circle>
    </svg>
    <span style="flex-grow: 1; font-size: 15px; color: #9AA1A6;">何を食べましたか</span>
    <div style="width: 44px; height: 44px; border-radius: 22px; background: #3F6B52; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h13"></path>
        <path d="M12.5 6.5 19 12l-6.5 5.5"></path>
      </svg>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
