<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; font-family: "Hiragino Kaku Gothic ProN","Yu Gothic Medium","Yu Gothic",Meiryo,system-ui,sans-serif; font-size: 15px; line-height: 1.7; -webkit-font-smoothing: antialiased; }
    a { color: #3F6B52; } a:hover { color: #2F6F4E; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #F1F4EE; background-image: linear-gradient(#E2E8DE 1px, transparent 1px), linear-gradient(90deg, #E2E8DE 1px, transparent 1px); background-size: 26px 26px; background-position: -1px -1px; color: #22262A; padding: 16px 16px 0; display: flex; flex-direction: column; overflow: hidden;">

  <div style="display: flex; align-items: baseline; gap: 10px; padding-bottom: 14px;">
    <div style="font-size: 16px; font-weight: 600; letter-spacing: .02em;">食事・血圧の記録</div>
    <div style="margin-left: auto; font-size: 13px; color: #6B7278;">8/26（水）</div>
  </div>

  <div style="background: #FFFFFF; border: 1px solid #DDE3DA; border-radius: 10px; padding: 14px 14px 10px;">
    <div style="display: flex; align-items: baseline; gap: 8px; padding-bottom: 12px;">
      <div style="font-size: 13px; font-weight: 600;">この7日</div>
      <div style="font-size: 12px; color: #6B7278;">上が塩分（横線が 6g）、下が朝の上の値</div>
    </div>

    <div style="position: relative;">
      <div style="display: flex; gap: 5px;">
        <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;">
          <div style="height: 56px; width: 100%; display: flex; align-items: flex-end; justify-content: center;">
            <div style="width: 15px; height: 59px; background: #B8412A; border-radius: 2px 2px 0 0;"></div>
          </div>
          <div style="font-size: 10px; color: #6B7278;">8/20</div>
          <div style="font-size: 12.5px; font-variant-numeric: tabular-nums; color: #B8412A; font-family: 'Hiragino Mincho ProN','Yu Mincho',YuMincho,'MS PMincho',serif;">142</div>
        </div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;">
          <div style="height: 56px; width: 100%; display: flex; align-items: flex-end; justify-content: center;">
            <div style="width: 15px; height: 32px; background: #2F6F4E; border-radius: 2px 2px 0 0;"></div>
          </div>
          <div style="font-size: 10px; color: #6B7278;">8/21</div>
          <div style="font-size: 12.5px; font-variant-numeric: tabular-nums; color: #B8412A; font-family: 'Hiragino Mincho ProN','Yu Mincho',YuMincho,'MS PMincho',serif;">140</div>
        </div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;">
          <div style="height: 56px; width: 100%; display: flex; align-items: flex-end; justify-content: center;">
            <div style="width: 15px; height: 46px; background: #B8412A; border-radius: 2px 2px 0 0;"></div>
          </div>
          <div style="font-size: 10px; color: #6B7278;">8/22</div>
          <div style="font-size: 12.5px; font-variant-numeric: tabular-nums; color: #B8412A; font-family: 'Hiragino Mincho ProN','Yu Mincho',YuMincho,'MS PMincho',serif;">136</div>
        </div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;">
          <div style="height: 56px; width: 100%; display: flex; align-items: flex-end; justify-content: center;">
            <div style="width: 15px; height: 54px; background: #B8412A; border-radius: 2px 2px 0 0;"></div>
          </div>
          <div style="font-size: 10px; color: #6B7278;">8/23</div>
          <div style="font-size: 12.5px; font-variant-numeric: tabular-nums; color: #6B7278; font-family: 'Hiragino Mincho ProN','Yu Mincho',YuMincho,'MS PMincho',serif;">133</div>
        </div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;">
          <div style="height: 56px; width: 100%; display: flex; align-items: flex-end; justify-content: center;">
            <div style="width: 15px; height: 41px; background: #2F6F4E; border-radius: 2px 2px 0 0;"></div>
          </div>
          <div style="font-size: 10px; color: #6B7278;">8/24</div>
          <div style="font-size: 12.5px; font-variant-numeric: tabular-nums; color: #6B7278; font-family: 'Hiragino Mincho ProN','Yu Mincho',YuMincho,'MS PMincho',serif;">130</div>
        </div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;">
          <div style="height: 56px; width: 100%; display: flex; align-items: flex-end; justify-content: center;">
            <div style="width: 15px; height: 35px; background: #2F6F4E; border-radius: 2px 2px 0 0;"></div>
          </div>
          <div style="font-size: 10px; color: #6B7278;">8/25</div>
          <div style="font-size: 12.5px; font-variant-numeric: tabular-nums; color: #6B7278; font-family: 'Hiragino Mincho ProN','Yu Mincho',YuMincho,'MS PMincho',serif;">127</div>
        </div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; background: #EBF1E9; border-radius: 4px;">
          <div style="height: 56px; width: 100%; display: flex; align-items: flex-end; justify-content: center;">
            <div style="width: 15px; height: 44px; background: #2F6F4E; border-radius: 2px 2px 0 0;"></div>
          </div>
          <div style="font-size: 10px; color: #22262A; font-weight: 600;">8/26</div>
          <div style="font-size: 12.5px; font-variant-numeric: tabular-nums; color: #2F6F4E; font-family: 'Hiragino Mincho ProN','Yu Mincho',YuMincho,'MS PMincho',serif;">124</div>
        </div>
      </div>
      <div style="position: absolute; left: 0; right: 0; top: 27px; height: 1px; background: #22262A; opacity: .4;"></div>
      <div style="position: absolute; left: 0; right: 0; top: 72px; height: 1px; background: #A9B5A5;"></div>
    </div>
  </div>

  <div style="display: flex; align-items: flex-end; gap: 10px; padding: 20px 2px 4px;">
    <span style="font-size: 46px; line-height: 1; color: #2F6F4E; font-variant-numeric: tabular-nums; font-family: 'Hiragino Mincho ProN','Yu Mincho',YuMincho,'MS PMincho',serif;">5.8</span>
    <span style="font-size: 16px; color: #6B7278; padding-bottom: 4px;">g</span>
    <span style="margin-left: auto; font-size: 13px; color: #6B7278; padding-bottom: 4px;">目標まで あと 0.2g</span>
  </div>

  <div style="display: flex; flex-direction: column; padding-top: 10px;">
    <div style="display: flex; align-items: baseline; gap: 10px; padding: 12px 2px; border-top: 1px solid #C8D2C4;">
      <span style="font-size: 12.5px; color: #6B7278; width: 26px;">朝</span>
      <span>冷奴・納豆・トマトジュース</span>
      <span style="margin-left: auto; font-family: 'Hiragino Mincho ProN','Yu Mincho',YuMincho,'MS PMincho',serif; font-size: 17px; font-variant-numeric: tabular-nums;">0.6</span>
    </div>
    <div style="display: flex; align-items: baseline; gap: 10px; padding: 12px 2px; border-top: 1px solid #DDE3DA;">
      <span style="font-size: 12.5px; color: #6B7278; width: 26px;">昼</span>
      <span>担々麺と半チャーハン<span style="color: #6B7278; font-size: 12.5px;">　汁を残した</span></span>
      <span style="margin-left: auto; font-family: 'Hiragino Mincho ProN','Yu Mincho',YuMincho,'MS PMincho',serif; font-size: 17px; font-variant-numeric: tabular-nums;">3.8</span>
    </div>
    <div style="display: flex; align-items: baseline; gap: 10px; padding: 12px 2px; border-top: 1px solid #DDE3DA;">
      <span style="font-size: 12.5px; color: #6B7278; width: 26px;">夜</span>
      <span>無塩そば・めかぶ・卵</span>
      <span style="margin-left: auto; font-family: 'Hiragino Mincho ProN','Yu Mincho',YuMincho,'MS PMincho',serif; font-size: 17px; font-variant-numeric: tabular-nums;">1.4</span>
    </div>
  </div>

  <div style="display: flex; align-items: baseline; gap: 10px; padding: 12px 2px; border-bottom: 1px solid #C8D2C4;">
    <span style="font-size: 12.5px; color: #6B7278; width: 26px;">血圧</span>
    <span style="font-size: 13.5px; color: #6B7278;">朝・起床後・服薬前</span>
    <span style="margin-left: auto; font-family: 'Hiragino Mincho ProN','Yu Mincho',YuMincho,'MS PMincho',serif; font-size: 20px; font-variant-numeric: tabular-nums;"><span style="color: #2F6F4E;">124</span><span style="color: #6B7278; font-size: 15px;"> / </span><span style="color: #2C6FA8;">83</span></span>
  </div>

  <div style="margin-top: auto; padding: 18px 2px 0;">
    <div style="font-size: 12.5px; color: #6B7278; padding-bottom: 8px;">早見表から入れる</div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 18px;">
      <div style="display: flex; align-items: baseline; gap: 8px; padding: 5px 0; border-bottom: 1px solid #DDE3DA;">
        <span style="font-size: 13.5px;">味噌汁</span>
        <span style="margin-left: auto; font-family: 'Hiragino Mincho ProN','Yu Mincho',YuMincho,'MS PMincho',serif; font-variant-numeric: tabular-nums;">1.4</span>
      </div>
      <div style="display: flex; align-items: baseline; gap: 8px; padding: 5px 0; border-bottom: 1px solid #DDE3DA;">
        <span style="font-size: 13.5px;">定食</span>
        <span style="margin-left: auto; font-family: 'Hiragino Mincho ProN','Yu Mincho',YuMincho,'MS PMincho',serif; font-variant-numeric: tabular-nums;">4.2</span>
      </div>
      <div style="display: flex; align-items: baseline; gap: 8px; padding: 5px 0; border-bottom: 1px solid #DDE3DA;">
        <span style="font-size: 13.5px;">餃子6個</span>
        <span style="margin-left: auto; font-family: 'Hiragino Mincho ProN','Yu Mincho',YuMincho,'MS PMincho',serif; font-variant-numeric: tabular-nums;">1.2</span>
      </div>
      <div style="display: flex; align-items: baseline; gap: 8px; padding: 5px 0; border-bottom: 1px solid #DDE3DA;">
        <span style="font-size: 13.5px;">納豆</span>
        <span style="margin-left: auto; font-family: 'Hiragino Mincho ProN','Yu Mincho',YuMincho,'MS PMincho',serif; font-variant-numeric: tabular-nums;">0.4</span>
      </div>
    </div>
  </div>

  <div style="display: flex; gap: 8px; padding: 16px 0;">
    <div style="flex-grow: 1; background: #3F6B52; color: #FFFFFF; border-radius: 8px; padding: 13px 14px; font-size: 15px; text-align: center;">食事を記録する</div>
    <div style="border: 1px solid #DDE3DA; background: #FFFFFF; border-radius: 8px; padding: 13px 16px; font-size: 15px;">血圧</div>
  </div>

</div>
</x-dc>

</html>
